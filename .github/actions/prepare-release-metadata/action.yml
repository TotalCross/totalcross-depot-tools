name: Prepare release metadata
description: Resolve a release version and next tag inside an existing release job.
inputs:
  dependency:
    required: true
  version-command:
    required: true
  version-env:
    required: true
outputs:
  tag-name:
    value: ${{ steps.metadata.outputs.tag-name }}
runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      env:
        DEPENDENCY: ${{ inputs.dependency }}
        VERSION_COMMAND: ${{ inputs.version-command }}
        VERSION_ENV: ${{ inputs.version-env }}
      run: |
        version="$(eval "${VERSION_COMMAND}")"
        test -n "${version}"
        tag_name="$(.github/scripts/next-release-tag.sh "${DEPENDENCY}" "${version}")"
        printf '%s=%s\nTAG_NAME=%s\n' "${VERSION_ENV}" "${version}" "${tag_name}" >> "$GITHUB_ENV"
        echo "tag-name=${tag_name}" >> "$GITHUB_OUTPUT"
