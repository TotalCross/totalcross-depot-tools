name: Build and package native CMake library
description: Configure, build, install and package one repository dependency.
inputs:
  source-dir: { required: true }
  build-dir: { required: true }
  install-dir: { required: true }
  platform-arch: { required: true }
  generator: { required: false, default: Ninja }
  configuration: { required: false, default: Release }
  cmake-args: { required: false, default: '' }
  run-tests: { required: false, default: 'false' }
  docker-image: { required: false, default: '' }
  docker-platform: { required: false, default: '' }
  package-script: { required: true }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        scripts/build-cmake-multi.sh \
          --source-dir '${{ inputs.source-dir }}' \
          --build-dir '${{ inputs.build-dir }}' \
          --install-dir '${{ inputs.install-dir }}' \
          --platform-arch '${{ inputs.platform-arch }}' \
          --generator '${{ inputs.generator }}' \
          --configuration '${{ inputs.configuration }}' \
          --cmake-args '${{ inputs.cmake-args }}' \
          --run-tests '${{ inputs.run-tests }}' \
          --docker-image '${{ inputs.docker-image }}' \
          --docker-platform '${{ inputs.docker-platform }}' \
          --package-script '${{ inputs.package-script }}'
