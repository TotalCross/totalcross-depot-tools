name: Build and package native CMake library
description: Configure, build, install and package one repository dependency.
inputs:
  source-dir: { required: true }
  build-dir: { required: true }
  install-dir: { required: true }
  platform-arch: { required: true }
  generator: { required: false, default: Ninja }
  configuration: { required: false, default: Release }
  cmake-args: { required: false, default: '' }
  run-tests: { required: false, default: 'false' }
  docker-image: { required: false, default: '' }
  docker-platform: { required: false, default: '' }
  package-script: { required: true }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker_image='${{ inputs.docker-image }}'
        docker_platform='${{ inputs.docker-platform }}'
        if { [ -n "${docker_image}" ] && [ -z "${docker_platform}" ]; } || { [ -z "${docker_image}" ] && [ -n "${docker_platform}" ]; }; then
          echo '::error::docker-image and docker-platform must either both be empty or both be set.'
          exit 1
        fi

        build_command=$(cat <<'EOF'
        cmake -S "${{ inputs.source-dir }}" -B "${{ inputs.build-dir }}" -DCMAKE_BUILD_TYPE=Release ${{ inputs.cmake-args }} -G "${{ inputs.generator }}"
        cmake --build "${{ inputs.build-dir }}" --config "${{ inputs.configuration }}"
        if [ "${{ inputs.run-tests }}" = true ]; then
          ctest --test-dir "${{ inputs.build-dir }}" -C "${{ inputs.configuration }}" --output-on-failure
        fi
        cmake --install "${{ inputs.build-dir }}" --config "${{ inputs.configuration }}" --prefix "${{ inputs.install-dir }}"
        bash "${{ inputs.package-script }}" "${{ inputs.build-dir }}" "${{ inputs.install-dir }}" "${{ inputs.platform-arch }}"
        EOF
        )

        if [ -n "${docker_image}" ]; then
          workspace="${GITHUB_WORKSPACE:-$PWD}"
          docker run --rm --platform "${docker_platform}" -v "${workspace}:/sources" -w /sources -t "${docker_image}" bash -lc "${build_command}"
        else
          bash -lc "${build_command}"
        fi
