name: Pin bundle release
description: Update deps.yml, commit the generated release tag, and push it before tagging.
inputs:
  dependency:
    required: true
  tag:
    required: true
outputs:
  commit:
    description: Commit that pins the release in deps.yml.
    value: ${{ steps.pin.outputs.commit }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        "${GITHUB_ACTION_PATH}/../../scripts/update-deps-release.sh" "${{ inputs.dependency }}" "${{ inputs.tag }}"
        if git diff --quiet -- deps.yml; then
          echo "commit=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add deps.yml
        git commit -m "chore(${{ inputs.dependency }}): update bundled release"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
