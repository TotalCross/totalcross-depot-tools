name: Build libpng static libraries

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - libpng/**
      - .github/workflows/build-libpng.yml
  pull_request:
    branches: [ master ]
    paths:
      - libpng/**
      - .github/workflows/build-libpng.yml

env:
  LIBPNG_VERSION: 1.6.48
  ZLIB_NG_VERSION: 2.1.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            zlib_platform: linux
            zlib_arch: x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            zlib_platform: linux
            zlib_arch: armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            zlib_platform: linux
            zlib_arch: aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform "${{ matrix.zlib_platform }}" \
            --arch "${{ matrix.zlib_arch }}" \
            --release-tag "zlib-ng-${ZLIB_NG_VERSION}"

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v1.0.7 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/libpng -B /sources/libpng/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DZLIB_DIR=/sources/zlib-ng/local/${{ matrix.zlib_platform }}/${{ matrix.zlib_arch }} \
                -G Ninja &&
              cmake --build /sources/libpng/build/${{ matrix.project }} &&
              cmake --install /sources/libpng/build/${{ matrix.project }} --prefix /sources/libpng/build/${{ matrix.project }}/install &&
              bash /sources/libpng/scripts/package-artifact.sh \
                /sources/libpng/build/${{ matrix.project }} \
                /sources/libpng/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-${{ matrix.project }}
          path: libpng/build/${{ matrix.project }}/libpng-*.tar.gz

  build-windows:
    name: Build windows/x86
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        shell: bash
        run: |
          bash zlib-ng/fetch.sh \
            --platform windows \
            --arch x86 \
            --release-tag "zlib-ng-${ZLIB_NG_VERSION}"

      - name: Build static libraries
        shell: bash
        run: |
          cmake -S libpng -B libpng/build/windows-x86 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/windows/x86" \
            -G "Visual Studio 17 2022" \
            -A Win32
          cmake --build libpng/build/windows-x86 --config Release
          cmake --install libpng/build/windows-x86 --config Release --prefix libpng/build/windows-x86/install
          bash libpng/scripts/package-artifact.sh libpng/build/windows-x86 libpng/build/windows-x86/install windows/x86

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-windows-x86
          path: libpng/build/windows-x86/libpng-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform android \
            --arch arm64-v8a \
            --release-tag "zlib-ng-${ZLIB_NG_VERSION}"

      - name: Build static libraries
        run: |
          cmake -S libpng -B libpng/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/android/arm64-v8a" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build libpng/build/android-arm64-v8a
          cmake --install libpng/build/android-arm64-v8a --prefix libpng/build/android-arm64-v8a/install
          bash libpng/scripts/package-artifact.sh libpng/build/android-arm64-v8a libpng/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-android-arm64-v8a
          path: libpng/build/android-arm64-v8a/libpng-*.tar.gz

  build-ios:
    name: Build ios/arm64
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform ios \
            --arch arm64 \
            --release-tag "zlib-ng-${ZLIB_NG_VERSION}"

      - name: Build static libraries
        run: |
          cmake -S libpng -B libpng/build/ios-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/ios/arm64" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -G Xcode
          cmake --build libpng/build/ios-arm64 --config Release
          cmake --install libpng/build/ios-arm64 --config Release --prefix libpng/build/ios-arm64/install
          bash libpng/scripts/package-artifact.sh libpng/build/ios-arm64 libpng/build/ios-arm64/install ios/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-ios-arm64
          path: libpng/build/ios-arm64/libpng-*.tar.gz

  build-macos:
    name: Build macos/arm64
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform macos \
            --arch arm64 \
            --release-tag "zlib-ng-${ZLIB_NG_VERSION}"

      - name: Build static libraries
        run: |
          cmake -S libpng -B libpng/build/macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/macos/arm64" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -G Ninja
          cmake --build libpng/build/macos-arm64
          cmake --install libpng/build/macos-arm64 --prefix libpng/build/macos-arm64/install
          bash libpng/scripts/package-artifact.sh libpng/build/macos-arm64 libpng/build/macos-arm64/install macos/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-macos-arm64
          path: libpng/build/macos-arm64/libpng-*.tar.gz
