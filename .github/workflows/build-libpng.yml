name: Build libpng static libraries

on:
  workflow_call:
    inputs:
      zlib_ng_release_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zlib_ng_release_tag:
        description: Optional zlib-ng release tag to use
        required: false
        type: string
  pull_request:
    branches: [ main, master ]
    paths:
      - deps.yml
      - libpng/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - zlib-ng/fetch.sh
      - .github/scripts/read-deps-release.sh
      - .github/workflows/build-libpng.yml

env:
  LIBPNG_VERSION: 1.6.48
  ZLIB_NG_VERSION: 2.1.6
  REQUESTED_ZLIB_NG_RELEASE_TAG: ${{ inputs.zlib_ng_release_tag }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            zlib_platform: linux
            zlib_arch: x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            zlib_platform: linux
            zlib_arch: armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            zlib_platform: linux
            zlib_arch: aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform "${{ matrix.zlib_platform }}" \
            --arch "${{ matrix.zlib_arch }}" \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.1 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/libpng -B /sources/libpng/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DZLIB_DIR=/sources/zlib-ng/local/${{ matrix.zlib_platform }}/${{ matrix.zlib_arch }} \
                -G Ninja &&
              cmake --build /sources/libpng/build/${{ matrix.project }} &&
              cmake --install /sources/libpng/build/${{ matrix.project }} --prefix /sources/libpng/build/${{ matrix.project }}/install &&
              bash /sources/libpng/scripts/package-artifact.sh \
                /sources/libpng/build/${{ matrix.project }} \
                /sources/libpng/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-${{ matrix.project }}
          path: libpng/build/${{ matrix.project }}/libpng-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        shell: bash
        run: |
          bash zlib-ng/fetch.sh \
            --platform windows \
            --arch ${{ matrix.arch }} \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        shell: bash
        run: |
          cmake -S libpng -B libpng/build/windows-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/windows/${{ matrix.arch }}" \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.cmake_platform }}
          cmake --build libpng/build/windows-${{ matrix.arch }} --config Release
          cmake --install libpng/build/windows-${{ matrix.arch }} --config Release --prefix libpng/build/windows-${{ matrix.arch }}/install
          bash libpng/scripts/package-artifact.sh libpng/build/windows-${{ matrix.arch }} libpng/build/windows-${{ matrix.arch }}/install windows/${{ matrix.arch }}

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 libpng/build/windows-${{ matrix.arch }}/libpng-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-windows-${{ matrix.arch }}
          path: libpng/build/windows-${{ matrix.arch }}/libpng-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform android \
            --arch arm64-v8a \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        run: |
          cmake -S libpng -B libpng/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/android/arm64-v8a" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build libpng/build/android-arm64-v8a
          cmake --install libpng/build/android-arm64-v8a --prefix libpng/build/android-arm64-v8a/install
          bash libpng/scripts/package-artifact.sh libpng/build/android-arm64-v8a libpng/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-android-arm64-v8a
          path: libpng/build/android-arm64-v8a/libpng-*.tar.gz

  build-apple:
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            build_dir: macos-arm64
            cmake_generator: Ninja
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: ios
            arch: arm64
            build_dir: ios-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          - platform: ios-simulator
            arch: arm64
            build_dir: ios-simulator-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        run: |
          cmake -S libpng -B libpng/build/${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/${{ matrix.platform }}/${{ matrix.arch }}" \
            ${{ matrix.cmake_args }} \
            -G "${{ matrix.cmake_generator }}"
          cmake --build libpng/build/${{ matrix.build_dir }} --config Release
          cmake --install libpng/build/${{ matrix.build_dir }} --config Release --prefix libpng/build/${{ matrix.build_dir }}/install
          bash libpng/scripts/package-artifact.sh libpng/build/${{ matrix.build_dir }} libpng/build/${{ matrix.build_dir }}/install ${{ matrix.platform }}/${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-${{ matrix.build_dir }}
          path: libpng/build/${{ matrix.build_dir }}/libpng-*.tar.gz

  package-ios:
    name: Package iOS XCFramework
    needs: build-apple
    runs-on: macos-15

    steps:
      - name: Download iOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: libpng-ios-arm64
          path: package-input/ios

      - name: Download iOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: libpng-ios-simulator-arm64
          path: package-input/ios-simulator

      - name: Create XCFramework
        run: |
          mkdir -p package-work package-output
          tar -xzf package-input/ios/libpng-ios-arm64.tar.gz -C package-work
          tar -xzf package-input/ios-simulator/libpng-ios-simulator-arm64.tar.gz -C package-work

          device_root="${PWD}/package-work/libpng/ios/arm64"
          simulator_root="${PWD}/package-work/libpng/ios-simulator/arm64"
          device_lib="$(find "${device_root}/lib" -type f \( -name "libpng*.a" -o -name "png*.a" \) | head -n 1)"
          simulator_lib="$(find "${simulator_root}/lib" -type f \( -name "libpng*.a" -o -name "png*.a" \) | head -n 1)"

          if [ -z "${device_lib}" ] || [ -z "${simulator_lib}" ]; then
            echo "Unable to locate libpng iOS static libraries" >&2
            exit 1
          fi

          xcodebuild -create-xcframework \
            -library "${device_lib}" -headers "${device_root}/include" \
            -library "${simulator_lib}" -headers "${simulator_root}/include" \
            -output package-output/libpng-ios.xcframework

          cd package-output
          ditto -c -k --sequesterRsrc --keepParent libpng-ios.xcframework libpng-ios.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: libpng-ios-xcframework
          path: package-output/libpng-ios.xcframework.zip
