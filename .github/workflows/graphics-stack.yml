name: Graphics stack operation

on:
  workflow_call:
    inputs:
      operation:
        required: false
        default: build
        type: string
      libraries:
        required: false
        default: all
        type: string
    outputs:
      plan:
        value: ${{ jobs.plan.outputs.plan }}
      recoveries:
        value: ${{ jobs.plan.outputs.recoveries }}
  workflow_dispatch:
    inputs:
      operation:
        description: Build, release, or force-release.
        required: true
        default: build
        type: choice
        options: [build, release, force-release]
      libraries:
        description: Comma-separated graphics members or all.
        required: true
        default: all
        type: string

jobs:
  plan:
    uses: ./.github/workflows/native-stack-plan.yml
    with:
      stack: graphics
      operation: ${{ inputs.operation }}
      libraries: ${{ inputs.libraries }}
