name: Validate commit messages

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Conventional Commits
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            ./.github/scripts/validate-commit-message.sh --range "${BASE_SHA}..${HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            ./.github/scripts/validate-commit-message.sh --range "${BEFORE_SHA}..${SHA}"
          else
            ./.github/scripts/validate-commit-message.sh "${SHA}"
          fi
