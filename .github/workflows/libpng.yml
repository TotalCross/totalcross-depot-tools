name: libpng native operation

on:
  workflow_call:
    inputs:
      operation:
        required: false
        default: build
        type: string
    outputs:
      status:
        value: ${{ jobs.operation.outputs.status }}
      effective_release_tag:
        value: ${{ jobs.operation.outputs.effective_release_tag }}
      release_url:
        value: ${{ jobs.operation.outputs.release_url }}
      artifact_manifest:
        value: ${{ jobs.operation.outputs.artifact_manifest }}
  workflow_dispatch:
    inputs:
      operation:
        description: Build, release, or force-release. Publication is added in a later milestone.
        required: true
        default: build
        type: choice
        options: [build, release, force-release]
  pull_request:
    branches: [main, master]
    paths: [deps.yml, config/native-builds.yml, libpng/**, scripts/build-cmake-multi.sh, scripts/build-native-target.sh, scripts/fetch-native-dependencies.sh, scripts/native-build.py, scripts/package-native-ios-xcframework.sh, .github/actions/build-native-library/action.yml, .github/workflows/libpng.yml, .github/workflows/native-library-operation.yml]

permissions:
  contents: write

jobs:
  operation:
    uses: ./.github/workflows/native-library-operation.yml
    with:
      library: libpng
      operation: ${{ inputs.operation || 'build' }}
