name: Build QR code static libraries

on:
  workflow_call:
    inputs:
      dependency:
        required: true
        type: string
      library:
        required: true
        type: string
      build_windows:
        required: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ inputs.dependency }} ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Build static library
        run: |
          docker run --platform ${{ matrix.docker_platform }} -v "${PWD}:/sources" -w /sources -t totalcross/${{ matrix.project }}:v2.0.1 bash -lc "
            cmake -S /sources/${{ inputs.dependency }} -B /sources/${{ inputs.dependency }}/build/${{ matrix.project }} -DCMAKE_BUILD_TYPE=Release -G Ninja &&
            cmake --build /sources/${{ inputs.dependency }}/build/${{ matrix.project }} &&
            cmake --install /sources/${{ inputs.dependency }}/build/${{ matrix.project }} --prefix /sources/${{ inputs.dependency }}/build/${{ matrix.project }}/install &&
            bash /sources/${{ inputs.dependency }}/scripts/package-artifact.sh /sources/${{ inputs.dependency }}/build/${{ matrix.project }} /sources/${{ inputs.dependency }}/build/${{ matrix.project }}/install ${{ matrix.platform_arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-${{ matrix.project }}
          path: ${{ inputs.dependency }}/build/${{ matrix.project }}/${{ inputs.dependency }}-*.tar.gz

  build-windows:
    name: Build ${{ inputs.dependency }} windows/${{ matrix.arch }}
    if: ${{ inputs.build_windows }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: ${{ inputs.dependency }}
          build-dir: ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}
          install-dir: ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/install
          platform-arch: windows/${{ matrix.arch }}
          generator: Visual Studio 17 2022
          cmake-args: -A ${{ matrix.cmake_platform }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          package-script: ${{ inputs.dependency }}/scripts/package-artifact.sh
      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/${{ inputs.dependency }}-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-windows-${{ matrix.arch }}
          path: ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/${{ inputs.dependency }}-*.tar.gz

  build-android:
    name: Build ${{ inputs.dependency }} android/arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-android-native
      - name: Build static library
        run: |
          cmake -S ${{ inputs.dependency }} -B ${{ inputs.dependency }}/build/android-arm64-v8a -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF -G Ninja
          cmake --build ${{ inputs.dependency }}/build/android-arm64-v8a
          cmake --install ${{ inputs.dependency }}/build/android-arm64-v8a --prefix ${{ inputs.dependency }}/build/android-arm64-v8a/install
          bash ${{ inputs.dependency }}/scripts/package-artifact.sh ${{ inputs.dependency }}/build/android-arm64-v8a ${{ inputs.dependency }}/build/android-arm64-v8a/install android/arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-android-arm64-v8a
          path: ${{ inputs.dependency }}/build/android-arm64-v8a/${{ inputs.dependency }}-*.tar.gz

  build-apple:
    name: Build and package ${{ inputs.dependency }} Apple arm64 artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Build macOS static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: ${{ inputs.dependency }}
          build-dir: ${{ inputs.dependency }}/build/macos-arm64
          install-dir: ${{ inputs.dependency }}/build/macos-arm64/install
          platform-arch: macos/arm64
          generator: Ninja
          cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
          package-script: ${{ inputs.dependency }}/scripts/package-artifact.sh

      - name: Build iOS device static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: ${{ inputs.dependency }}
          build-dir: ${{ inputs.dependency }}/build/ios-arm64
          install-dir: ${{ inputs.dependency }}/build/ios-arm64/install
          platform-arch: ios/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: ${{ inputs.dependency }}/scripts/package-artifact.sh

      - name: Build iOS simulator static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: ${{ inputs.dependency }}
          build-dir: ${{ inputs.dependency }}/build/ios-simulator-arm64
          install-dir: ${{ inputs.dependency }}/build/ios-simulator-arm64/install
          platform-arch: ios-simulator/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: ${{ inputs.dependency }}/scripts/package-artifact.sh

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library ${{ inputs.dependency }}/build/ios-arm64/install/lib/lib${{ inputs.library }}.a -headers ${{ inputs.dependency }}/build/ios-arm64/install/include \
            -library ${{ inputs.dependency }}/build/ios-simulator-arm64/install/lib/lib${{ inputs.library }}.a -headers ${{ inputs.dependency }}/build/ios-simulator-arm64/install/include \
            -output ${{ inputs.dependency }}/build/${{ inputs.dependency }}-ios.xcframework
          ditto -c -k --sequesterRsrc --keepParent ${{ inputs.dependency }}/build/${{ inputs.dependency }}-ios.xcframework ${{ inputs.dependency }}/build/${{ inputs.dependency }}-ios.xcframework.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-macos-arm64
          path: ${{ inputs.dependency }}/build/macos-arm64/${{ inputs.dependency }}-*.tar.gz

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-arm64
          path: ${{ inputs.dependency }}/build/ios-arm64/${{ inputs.dependency }}-*.tar.gz

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-simulator-arm64
          path: ${{ inputs.dependency }}/build/ios-simulator-arm64/${{ inputs.dependency }}-*.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-xcframework
          path: ${{ inputs.dependency }}/build/${{ inputs.dependency }}-ios.xcframework.zip
