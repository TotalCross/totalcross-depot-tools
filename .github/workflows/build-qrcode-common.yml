name: Build QR code static libraries

on:
  workflow_call:
    inputs:
      dependency:
        required: true
        type: string
      library:
        required: true
        type: string
      build_windows:
        required: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ inputs.dependency }} ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Build static library
        run: |
          docker run --platform ${{ matrix.docker_platform }} -v "${PWD}:/sources" -w /sources -t totalcross/${{ matrix.project }}:v1.0.7 bash -lc "
            cmake -S /sources/${{ inputs.dependency }} -B /sources/${{ inputs.dependency }}/build/${{ matrix.project }} -DCMAKE_BUILD_TYPE=Release -G Ninja &&
            cmake --build /sources/${{ inputs.dependency }}/build/${{ matrix.project }} &&
            cmake --install /sources/${{ inputs.dependency }}/build/${{ matrix.project }} --prefix /sources/${{ inputs.dependency }}/build/${{ matrix.project }}/install &&
            bash /sources/${{ inputs.dependency }}/scripts/package-artifact.sh /sources/${{ inputs.dependency }}/build/${{ matrix.project }} /sources/${{ inputs.dependency }}/build/${{ matrix.project }}/install ${{ matrix.platform_arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-${{ matrix.project }}
          path: ${{ inputs.dependency }}/build/${{ matrix.project }}/${{ inputs.dependency }}-*.tar.gz

  build-windows:
    name: Build ${{ inputs.dependency }} windows/${{ matrix.arch }}
    if: ${{ inputs.build_windows }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build static library
        shell: bash
        run: |
          cmake -S ${{ inputs.dependency }} -B ${{ inputs.dependency }}/build/windows-${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A ${{ matrix.cmake_platform }}
          cmake --build ${{ inputs.dependency }}/build/windows-${{ matrix.arch }} --config Release
          cmake --install ${{ inputs.dependency }}/build/windows-${{ matrix.arch }} --config Release --prefix ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/install
          bash ${{ inputs.dependency }}/scripts/package-artifact.sh ${{ inputs.dependency }}/build/windows-${{ matrix.arch }} ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/install windows/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-windows-${{ matrix.arch }}
          path: ${{ inputs.dependency }}/build/windows-${{ matrix.arch }}/${{ inputs.dependency }}-*.tar.gz

  build-android:
    name: Build ${{ inputs.dependency }} android/arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build static library
        run: |
          cmake -S ${{ inputs.dependency }} -B ${{ inputs.dependency }}/build/android-arm64-v8a -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF -G Ninja
          cmake --build ${{ inputs.dependency }}/build/android-arm64-v8a
          cmake --install ${{ inputs.dependency }}/build/android-arm64-v8a --prefix ${{ inputs.dependency }}/build/android-arm64-v8a/install
          bash ${{ inputs.dependency }}/scripts/package-artifact.sh ${{ inputs.dependency }}/build/android-arm64-v8a ${{ inputs.dependency }}/build/android-arm64-v8a/install android/arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-android-arm64-v8a
          path: ${{ inputs.dependency }}/build/android-arm64-v8a/${{ inputs.dependency }}-*.tar.gz

  build-apple:
    name: Build ${{ inputs.dependency }} ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            build_dir: macos-arm64
            cmake_generator: Ninja
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: ios
            arch: arm64
            build_dir: ios-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          - platform: ios-simulator
            arch: arm64
            build_dir: ios-simulator-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build static library
        run: |
          cmake -S ${{ inputs.dependency }} -B ${{ inputs.dependency }}/build/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }} -G "${{ matrix.cmake_generator }}"
          cmake --build ${{ inputs.dependency }}/build/${{ matrix.build_dir }} --config Release
          cmake --install ${{ inputs.dependency }}/build/${{ matrix.build_dir }} --config Release --prefix ${{ inputs.dependency }}/build/${{ matrix.build_dir }}/install
          bash ${{ inputs.dependency }}/scripts/package-artifact.sh ${{ inputs.dependency }}/build/${{ matrix.build_dir }} ${{ inputs.dependency }}/build/${{ matrix.build_dir }}/install ${{ matrix.platform }}/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-${{ matrix.build_dir }}
          path: ${{ inputs.dependency }}/build/${{ matrix.build_dir }}/${{ inputs.dependency }}-*.tar.gz

  package-ios:
    name: Package ${{ inputs.dependency }} iOS XCFramework
    needs: build-apple
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-arm64
          path: package-input/ios
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-simulator-arm64
          path: package-input/ios-simulator
      - name: Create XCFramework
        run: |
          mkdir -p package-work package-output
          tar -xzf package-input/ios/${{ inputs.dependency }}-ios-arm64.tar.gz -C package-work
          tar -xzf package-input/ios-simulator/${{ inputs.dependency }}-ios-simulator-arm64.tar.gz -C package-work
          device_root="${PWD}/package-work/${{ inputs.dependency }}/ios/arm64"
          simulator_root="${PWD}/package-work/${{ inputs.dependency }}/ios-simulator/arm64"
          device_lib="${device_root}/lib/lib${{ inputs.library }}.a"
          simulator_lib="${simulator_root}/lib/lib${{ inputs.library }}.a"
          test -f "${device_lib}" && test -f "${simulator_lib}"
          xcodebuild -create-xcframework -library "${device_lib}" -headers "${device_root}/include" -library "${simulator_lib}" -headers "${simulator_root}/include" -output package-output/${{ inputs.dependency }}-ios.xcframework
          cd package-output
          ditto -c -k --sequesterRsrc --keepParent ${{ inputs.dependency }}-ios.xcframework ${{ inputs.dependency }}-ios.xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dependency }}-ios-xcframework
          path: package-output/${{ inputs.dependency }}-ios.xcframework.zip
