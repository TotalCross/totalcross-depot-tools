name: Build SQLite3 static libraries

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - sqlite3/**
      - .github/workflows/build-sqlite3.yml
  pull_request:
    branches: [ master ]
    paths:
      - sqlite3/**
      - .github/workflows/build-sqlite3.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static library
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v1.0.7 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/sqlite3 -B /sources/sqlite3/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/sources/sqlite3/build/${{ matrix.project }}/install \
                -G Ninja &&
              cmake --build /sources/sqlite3/build/${{ matrix.project }} &&
              cmake --install /sources/sqlite3/build/${{ matrix.project }} &&
              bash /sources/sqlite3/scripts/package-artifact.sh \
                /sources/sqlite3/build/${{ matrix.project }} \
                /sources/sqlite3/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-${{ matrix.project }}
          path: sqlite3/build/${{ matrix.project }}/sqlite3-*.tar.gz

  build-windows:
    name: Build windows/x86
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static library
        shell: bash
        run: |
          cmake -S sqlite3 -B sqlite3/build/windows-x86 \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Visual Studio 17 2022" \
            -A Win32
          cmake --build sqlite3/build/windows-x86 --config Release
          cmake --install sqlite3/build/windows-x86 --config Release --prefix sqlite3/build/windows-x86/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/windows-x86 sqlite3/build/windows-x86/install windows/x86

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-windows-x86
          path: sqlite3/build/windows-x86/sqlite3-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build static library
        run: |
          cmake -S sqlite3 -B sqlite3/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build sqlite3/build/android-arm64-v8a
          cmake --install sqlite3/build/android-arm64-v8a --prefix sqlite3/build/android-arm64-v8a/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/android-arm64-v8a sqlite3/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-android-arm64-v8a
          path: sqlite3/build/android-arm64-v8a/sqlite3-*.tar.gz

  build-ios:
    name: Build ios/arm64
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static library
        run: |
          cmake -S sqlite3 -B sqlite3/build/ios-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -G Xcode
          cmake --build sqlite3/build/ios-arm64 --config Release
          cmake --install sqlite3/build/ios-arm64 --config Release --prefix sqlite3/build/ios-arm64/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/ios-arm64 sqlite3/build/ios-arm64/install ios/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-ios-arm64
          path: sqlite3/build/ios-arm64/sqlite3-*.tar.gz

  build-macos:
    name: Build macos/arm64
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static library
        run: |
          cmake -S sqlite3 -B sqlite3/build/macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -G Ninja
          cmake --build sqlite3/build/macos-arm64
          cmake --install sqlite3/build/macos-arm64 --prefix sqlite3/build/macos-arm64/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/macos-arm64 sqlite3/build/macos-arm64/install macos/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-macos-arm64
          path: sqlite3/build/macos-arm64/sqlite3-*.tar.gz

