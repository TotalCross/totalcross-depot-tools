name: Build SQLite3 static libraries

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - sqlite3/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-sqlite3.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static library
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.1 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/sqlite3 -B /sources/sqlite3/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/sources/sqlite3/build/${{ matrix.project }}/install \
                -G Ninja &&
              cmake --build /sources/sqlite3/build/${{ matrix.project }} &&
              cmake --install /sources/sqlite3/build/${{ matrix.project }} &&
              bash /sources/sqlite3/scripts/package-artifact.sh \
                /sources/sqlite3/build/${{ matrix.project }} \
                /sources/sqlite3/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-${{ matrix.project }}
          path: sqlite3/build/${{ matrix.project }}/sqlite3-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static library
        shell: bash
        run: |
          cmake -S sqlite3 -B sqlite3/build/windows-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.cmake_platform }}
          cmake --build sqlite3/build/windows-${{ matrix.arch }} --config Release
          cmake --install sqlite3/build/windows-${{ matrix.arch }} --config Release --prefix sqlite3/build/windows-${{ matrix.arch }}/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/windows-${{ matrix.arch }} sqlite3/build/windows-${{ matrix.arch }}/install windows/${{ matrix.arch }}

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 sqlite3/build/windows-${{ matrix.arch }}/sqlite3-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-windows-${{ matrix.arch }}
          path: sqlite3/build/windows-${{ matrix.arch }}/sqlite3-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Build static library
        run: |
          cmake -S sqlite3 -B sqlite3/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build sqlite3/build/android-arm64-v8a
          cmake --install sqlite3/build/android-arm64-v8a --prefix sqlite3/build/android-arm64-v8a/install
          bash sqlite3/scripts/package-artifact.sh sqlite3/build/android-arm64-v8a sqlite3/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-android-arm64-v8a
          path: sqlite3/build/android-arm64-v8a/sqlite3-*.tar.gz

  build-apple:
    name: Build and package Apple arm64 artifacts
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Require arm64 macOS runner
        run: test "$(uname -m)" = arm64

      - name: Build macOS static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: sqlite3
          build-dir: sqlite3/build/macos-arm64
          install-dir: sqlite3/build/macos-arm64/install
          platform-arch: macos/arm64
          generator: Ninja
          cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
          package-script: sqlite3/scripts/package-artifact.sh

      - name: Build iOS device static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: sqlite3
          build-dir: sqlite3/build/ios-arm64
          install-dir: sqlite3/build/ios-arm64/install
          platform-arch: ios/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: sqlite3/scripts/package-artifact.sh

      - name: Build iOS simulator static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: sqlite3
          build-dir: sqlite3/build/ios-simulator-arm64
          install-dir: sqlite3/build/ios-simulator-arm64/install
          platform-arch: ios-simulator/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: sqlite3/scripts/package-artifact.sh

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library sqlite3/build/ios-arm64/install/lib/libsqlite3.a -headers sqlite3/build/ios-arm64/install/include \
            -library sqlite3/build/ios-simulator-arm64/install/lib/libsqlite3.a -headers sqlite3/build/ios-simulator-arm64/install/include \
            -output sqlite3/build/sqlite3-ios.xcframework
          ditto -c -k --sequesterRsrc --keepParent sqlite3/build/sqlite3-ios.xcframework sqlite3/build/sqlite3-ios.xcframework.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-macos-arm64
          path: sqlite3/build/macos-arm64/sqlite3-*.tar.gz

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-ios-arm64
          path: sqlite3/build/ios-arm64/sqlite3-*.tar.gz

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-ios-simulator-arm64
          path: sqlite3/build/ios-simulator-arm64/sqlite3-*.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqlite3-ios-xcframework
          path: sqlite3/build/sqlite3-ios.xcframework.zip
