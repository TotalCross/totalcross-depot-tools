name: Release libjpeg-turbo static libraries

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      libjpeg_turbo_version: ${{ steps.version.outputs.libjpeg_turbo_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Read libjpeg-turbo version
        id: version
        run: |
          libjpeg_turbo_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' libjpeg-turbo/CMakeLists.txt)"
          if [ -z "$libjpeg_turbo_version" ]; then
            echo "Could not read libjpeg-turbo version from libjpeg-turbo/CMakeLists.txt" >&2
            exit 1
          fi

          tag_name="$(.github/scripts/next-release-tag.sh libjpeg-turbo "${libjpeg_turbo_version}")"

          echo "libjpeg_turbo_version=${libjpeg_turbo_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release assets
    needs: prepare
    uses: ./.github/workflows/build-libjpeg-turbo.yml

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      LIBJPEG_TURBO_VERSION: ${{ needs.prepare.outputs.libjpeg_turbo_version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "libjpeg-turbo ${LIBJPEG_TURBO_VERSION}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Publish GitHub Release
        run: |
          gh release create "${TAG_NAME}" release-assets/* \
            --verify-tag \
            --title "libjpeg-turbo ${LIBJPEG_TURBO_VERSION} static libraries" \
            --notes "Static libjpeg-turbo ${LIBJPEG_TURBO_VERSION} libraries for TotalCross, including the classic libjpeg API and the TurboJPEG API."
