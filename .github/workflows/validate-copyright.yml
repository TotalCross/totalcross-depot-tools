name: Validate copyright headers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  copyright:
    name: Copyright headers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate copyright headers
        run: python3 tools/check-copyright.py
