name: Release Visual C++ runtime DLLs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate assets without changing pins, tags, or releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build release assets
    uses: ./.github/workflows/build-vcruntime.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Read redistributable release metadata
        run: |
          redist_version="$(tar -xOzf release-assets/vcruntime-windows-x86.tar.gz vcruntime/windows/x86/manifest.txt | awk -F= '/^redist_version=/{print $2; exit}')"
          test -n "${redist_version}"
          redist_major="${redist_version%%.*}"
          test -n "${redist_major}"
          tag_name="$(.github/scripts/next-release-tag.sh vcruntime "${redist_major}")"
          printf 'REDIST_VERSION=%s\nTAG_NAME=%s\n' "${redist_version}" "${tag_name}" >> "$GITHUB_ENV"

      - name: Pin bundle release
        if: ${{ !inputs.dry_run }}
        id: pin_bundle_release
        uses: ./.github/actions/pin-deps-release
        with:
          dependency: vcruntime
          tag: ${{ env.TAG_NAME }}

      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "vcruntime ${REDIST_VERSION}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${TAG_NAME}" release-assets/* \
            --verify-tag \
            --title "Visual C++ runtime ${REDIST_VERSION} DLLs" \
            --notes "Microsoft Visual C++ Redistributable runtime DLLs for TotalCross. Redistribution is governed by the applicable Microsoft Visual Studio license terms."

      - name: Revert bundle release pin after failure
        if: ${{ failure() && steps.pin_bundle_release.outputs.commit != '' }}
        uses: ./.github/actions/revert-deps-release-pin
        with:
          commit: ${{ steps.pin_bundle_release.outputs.commit }}
