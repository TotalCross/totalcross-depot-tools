name: Release qrcodegen static libraries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate assets without changing pins, tags, or releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: ./.github/workflows/build-qrcodegen.yml
  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read qrcodegen release metadata
        uses: ./.github/actions/prepare-release-metadata
        with:
          dependency: qrcodegen
          version-env: VERSION
          version-command: "awk '/^version:/{print $2; exit}' qrcodegen/manifest.yml"
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Pin bundle release
        if: ${{ !inputs.dry_run }}
        id: pin_bundle_release
        uses: ./.github/actions/pin-deps-release
        with:
          dependency: qrcodegen
          tag: ${{ env.TAG_NAME }}
      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "qrcodegen ${VERSION}"
          git push origin "refs/tags/${TAG_NAME}"
      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: gh release create "${TAG_NAME}" release-assets/* --verify-tag --title "qrcodegen ${VERSION} static libraries" --notes "Static qrcodegen ${VERSION} libraries for TotalCross."
      - name: Revert bundle release pin after failure
        if: ${{ failure() && steps.pin_bundle_release.outputs.commit != '' }}
        uses: ./.github/actions/revert-deps-release-pin
        with:
          commit: ${{ steps.pin_bundle_release.outputs.commit }}
