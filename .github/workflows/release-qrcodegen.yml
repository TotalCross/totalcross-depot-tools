name: Release qrcodegen static libraries

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          version="$(awk '/^version:/{print $2; exit}' qrcodegen/manifest.yml)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=$(.github/scripts/next-release-tag.sh qrcodegen "${version}")" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build-qrcodegen.yml
  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Pin bundle release
        id: pin_bundle_release
        uses: ./.github/actions/pin-deps-release
        with:
          dependency: qrcodegen
          tag: ${{ env.TAG_NAME }}
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "qrcodegen ${VERSION}"
          git push origin "refs/tags/${TAG_NAME}"
      - name: Publish GitHub Release
        run: gh release create "${TAG_NAME}" release-assets/* --verify-tag --title "qrcodegen ${VERSION} static libraries" --notes "Static qrcodegen ${VERSION} libraries for TotalCross."
      - name: Revert bundle release pin after failure
        if: ${{ failure() && steps.pin_bundle_release.outputs.commit != '' }}
        uses: ./.github/actions/revert-deps-release-pin
        with:
          commit: ${{ steps.pin_bundle_release.outputs.commit }}
