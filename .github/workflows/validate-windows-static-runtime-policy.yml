name: Validate Windows static runtime policy

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/scripts/test-windows-static-runtime-validator.ps1
      - .github/workflows/validate-windows-static-runtime-policy.yml
      - AGENTS.md
  pull_request:
    branches: [ main, master ]
    paths:
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/scripts/test-windows-static-runtime-validator.ps1
      - .github/workflows/validate-windows-static-runtime-policy.yml
      - AGENTS.md

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Validate /MT artifact directives
        shell: pwsh
        run: ./.github/scripts/test-windows-static-runtime-validator.ps1
