name: Release libpng

on:
  workflow_dispatch:

jobs:
  release:
    name: Build libpng
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Fetch zlib sources
        working-directory: zlib
        run: ./fetch.sh

      - name: Build and install zlib
        working-directory: zlib
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build/cmake
          cmake --install build/cmake

      - name: Fetch libpng sources
        working-directory: libpng
        run: ./fetch.sh

      - name: Build and install libpng
        working-directory: libpng
        run: |
          cmake -S . -B build/cmake -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib/install"
          cmake --build build/cmake
          cmake --install build/cmake

      - name: Package artifact
        working-directory: libpng
        run: ./scripts/package-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: libpng-1.6.43
          path: libpng/dist/*.tar.gz
