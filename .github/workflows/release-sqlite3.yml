name: Release SQLite3 static libraries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate assets without changing pins, tags, or releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      sqlite_version: ${{ steps.version.outputs.sqlite_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Read SQLite version
        id: version
        run: |
          sqlite_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' sqlite3/CMakeLists.txt)"
          if [ -z "$sqlite_version" ]; then
            echo "Could not read SQLite version from sqlite3/CMakeLists.txt" >&2
            exit 1
          fi

          tag_name="$(.github/scripts/next-release-tag.sh sqlite3 "${sqlite_version}")"

          echo "sqlite_version=${sqlite_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release assets
    needs: prepare
    uses: ./.github/workflows/build-sqlite3.yml

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SQLITE_VERSION: ${{ needs.prepare.outputs.sqlite_version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Pin bundle release
        if: ${{ !inputs.dry_run }}
        id: pin_bundle_release
        uses: ./.github/actions/pin-deps-release
        with:
          dependency: sqlite3
          tag: ${{ env.TAG_NAME }}

      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "SQLite ${SQLITE_VERSION}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${TAG_NAME}" release-assets/* \
            --verify-tag \
            --title "SQLite ${SQLITE_VERSION} static libraries" \
            --notes "Static SQLite ${SQLITE_VERSION} libraries for TotalCross."

      - name: Revert bundle release pin after failure
        if: ${{ failure() && steps.pin_bundle_release.outputs.commit != '' }}
        uses: ./.github/actions/revert-deps-release-pin
        with:
          commit: ${{ steps.pin_bundle_release.outputs.commit }}
