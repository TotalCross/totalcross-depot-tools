name: Release sqlite3

on:
  workflow_dispatch:

jobs:
  release:
    name: Build sqlite3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip

      - name: Fetch sources
        working-directory: sqlite3
        run: ./fetch.sh

      - name: Build and install
        working-directory: sqlite3
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build/cmake
          cmake --install build/cmake

      - name: Package artifact
        working-directory: sqlite3
        run: ./scripts/package-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sqlite3-3.32.3
          path: sqlite3/dist/*.tar.gz

