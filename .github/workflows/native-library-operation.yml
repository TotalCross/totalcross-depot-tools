name: Native library operation

on:
  workflow_call:
    inputs:
      library:
        required: true
        type: string
      operation:
        required: false
        default: build
        type: string
    outputs:
      status:
        description: Build or release result status.
        value: ${{ jobs.summary.outputs.status }}
      effective_release_tag:
        description: Effective tag selected for a release operation.
        value: ${{ jobs.summary.outputs.effective_release_tag }}
      release_url:
        description: Existing or newly published GitHub Release URL.
        value: ${{ jobs.summary.outputs.release_url }}
      artifact_manifest:
        description: JSON list of artifact names produced by the selected library.
        value: ${{ jobs.summary.outputs.artifact_manifest }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    name: Plan ${{ inputs.library }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      apple_targets: ${{ steps.plan.outputs.apple_targets }}
      has_ios: ${{ steps.plan.outputs.has_ios }}
      artifact_manifest: ${{ steps.plan.outputs.artifact_manifest }}
      release_status: ${{ steps.release.outputs.status }}
      effective_release_tag: ${{ steps.release.outputs.effective_release_tag }}
      release_url: ${{ steps.release.outputs.release_url }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          LIBRARY: ${{ inputs.library }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native-build.py plan "${LIBRARY}" --operation "${OPERATION}" --format json > native-build-plan.json
          python3 - "${LIBRARY}" native-build-plan.json >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import subprocess
          import sys

          library, plan_path = sys.argv[1:]
          plan = json.load(open(plan_path, encoding="utf-8"))
          matrix = []
          apple_targets = []
          artifacts = []
          for target in plan["targets"][library]:
              resolved = json.loads(subprocess.check_output(
                  ["python3", "scripts/native-build.py", "show", library, target, "--format", "json"],
                  text=True,
              ))
              artifact = f"{library}-{resolved['build_dir_name']}"
              artifacts.append(artifact)
              if resolved["platform_family"] == "apple":
                  apple_targets.append(target)
              else:
                  matrix.append({
                      "artifact_name": artifact,
                      "build_dir_name": resolved["build_dir_name"],
                      "platform_family": resolved["platform_family"],
                      "runner": resolved["runner"],
                      "target": target,
                  })
          if "ios-arm64" in apple_targets:
              artifacts.append(f"{library}-ios-xcframework")
          compact = lambda value: json.dumps(value, separators=(",", ":"), sort_keys=True)
          print(f"matrix={compact(matrix)}")
          print(f"apple_targets={compact(apple_targets)}")
          print(f"has_ios={'true' if 'ios-arm64' in apple_targets else 'false'}")
          print(f"artifact_manifest={compact(artifacts)}")
          PY
      - id: release
        env:
          LIBRARY: ${{ inputs.library }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = build ]; then
            printf 'status=built\neffective_release_tag=\nrelease_url=\nshould_build=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          decision="$(python3 scripts/native-release.py --repository "${REPOSITORY}" select-tag "${LIBRARY}" --operation "${OPERATION}")"
          python3 - "${decision}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          decision = json.loads(sys.argv[1])
          status = decision["status"]
          if status == "recovery-required":
              raise SystemExit(f"native release recovery required: {decision['reason']}")
          should_build = "true" if status == "build-required" else "false"
          print(f"status={status}")
          print(f"effective_release_tag={decision['effective_release_tag']}")
          print(f"release_url={decision.get('release_url', '')}")
          print(f"should_build={should_build}")
          PY
      - name: Publish planning summary
        shell: bash
        run: |
          {
            echo '### Native build plan'
            echo
            echo '```json'
            cat native-build-plan.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ inputs.library }} ${{ matrix.target }}
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' && needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Android native toolchain
        if: ${{ matrix.platform_family == 'android' }}
        uses: ./.github/actions/setup-android-native
      - name: Fetch repository-pinned dependencies
        shell: bash
        run: scripts/fetch-native-dependencies.sh "${{ inputs.library }}" "${{ matrix.target }}"
      - name: Build, validate, install, and package
        shell: bash
        run: scripts/build-native-target.sh "${{ inputs.library }}" "${{ matrix.target }}"
      - name: Verify Windows static runtime
        if: ${{ matrix.platform_family == 'windows' }}
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 "${{ inputs.library }}/build/${{ matrix.build_dir_name }}/${{ inputs.library }}-*.tar.gz"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ inputs.library }}/build/${{ matrix.build_dir_name }}/${{ inputs.library }}-*.tar.gz

  apple:
    name: Build ${{ inputs.library }} Apple artifacts
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' && needs.plan.outputs.apple_targets != '[]' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build Apple targets
        env:
          APPLE_TARGETS: ${{ needs.plan.outputs.apple_targets }}
          LIBRARY: ${{ inputs.library }}
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r target; do
            [ -n "${target}" ] || continue
            targets+=("${target}")
          done < <(python3 - "${APPLE_TARGETS}" <<'PY'
          import json
          import sys
          print("\n".join(json.loads(sys.argv[1])))
          PY
          )
          for target in "${targets[@]}"; do
            scripts/fetch-native-dependencies.sh "${LIBRARY}" "${target}"
            scripts/build-native-target.sh "${LIBRARY}" "${target}"
          done
      - name: Package iOS XCFramework
        if: ${{ needs.plan.outputs.has_ios == 'true' }}
        shell: bash
        run: scripts/package-native-ios-xcframework.sh "${{ inputs.library }}"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.library }}-macos-arm64
          path: ${{ inputs.library }}/build/macos-arm64/${{ inputs.library }}-*.tar.gz
      - name: Upload iOS device artifact
        if: ${{ needs.plan.outputs.has_ios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.library }}-ios-arm64
          path: ${{ inputs.library }}/build/ios-arm64/${{ inputs.library }}-*.tar.gz
      - name: Upload iOS simulator artifact
        if: ${{ needs.plan.outputs.has_ios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.library }}-ios-simulator-arm64
          path: ${{ inputs.library }}/build/ios-simulator-arm64/${{ inputs.library }}-*.tar.gz
      - name: Upload iOS XCFramework
        if: ${{ needs.plan.outputs.has_ios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.library }}-ios-xcframework
          path: ${{ inputs.library }}/build/${{ inputs.library }}-ios.xcframework.zip

  publish:
    name: Publish ${{ inputs.library }} release
    needs: [plan, build, apple]
    if: ${{ (inputs.operation == 'release' || inputs.operation == 'force-release') && needs.plan.outputs.should_build == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.apple.result == 'success' || needs.apple.result == 'skipped') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: native-release-${{ inputs.library }}
      cancel-in-progress: false
    outputs:
      status: ${{ steps.result.outputs.status }}
      effective_release_tag: ${{ steps.result.outputs.effective_release_tag }}
      release_url: ${{ steps.result.outputs.release_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify declared release assets
        shell: bash
        run: python3 scripts/native-release.py verify-assets "${{ inputs.library }}" --paths 'release-assets/*'
      - id: recheck
        env:
          LIBRARY: ${{ inputs.library }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = force-release ]; then
            decision="$(python3 scripts/native-release.py --repository "${REPOSITORY}" select-tag "${LIBRARY}" --operation force-release)"
          else
            decision="$(python3 scripts/native-release.py --repository "${REPOSITORY}" inspect "${LIBRARY}" --effective-tag "${{ needs.plan.outputs.effective_release_tag }}")"
          fi
          python3 - "${decision}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          decision = json.loads(sys.argv[1])
          status = decision["status"]
          if status == "recovery-required":
              raise SystemExit(f"native release recovery required: {decision['reason']}")
          print(f"status={status}")
          print(f"effective_release_tag={decision['effective_release_tag']}")
          print(f"release_url={decision.get('release_url', '')}")
          PY
      - name: Prepare metadata before tagging
        if: ${{ steps.recheck.outputs.status == 'build-required' }}
        shell: bash
        run: python3 scripts/native-release.py prepare-metadata "${{ inputs.library }}" --effective-tag "${{ steps.recheck.outputs.effective_release_tag }}"
      - name: Commit and push release metadata
        if: ${{ steps.recheck.outputs.status == 'build-required' }}
        shell: bash
        env:
          LIBRARY: ${{ inputs.library }}
          EFFECTIVE_TAG: ${{ steps.recheck.outputs.effective_release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deps.yml "${LIBRARY}/manifest.yml"
          git commit -m "chore(${LIBRARY}): prepare ${EFFECTIVE_TAG} release" -m "Pin the effective release in the dependency manifest and compatible bundle index before tagging."
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Create immutable release tag
        if: ${{ steps.recheck.outputs.status == 'build-required' }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "${{ steps.recheck.outputs.effective_release_tag }}" -m "${{ inputs.library }} ${{ steps.recheck.outputs.effective_release_tag }}"
          git push origin "refs/tags/${{ steps.recheck.outputs.effective_release_tag }}"
      - name: Publish GitHub Release
        if: ${{ steps.recheck.outputs.status == 'build-required' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.recheck.outputs.effective_release_tag }}" release-assets/* --verify-tag --title "${{ inputs.library }} ${{ steps.recheck.outputs.effective_release_tag }}" --generate-notes
      - id: result
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          STATUS: ${{ steps.recheck.outputs.status }}
          EFFECTIVE_TAG: ${{ steps.recheck.outputs.effective_release_tag }}
          EXISTING_URL: ${{ steps.recheck.outputs.release_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_url="${EXISTING_URL}"
          if [ "${STATUS}" = build-required ]; then
            release_url="$(gh release view "${EFFECTIVE_TAG}" --repo "${REPOSITORY}" --json url --jq .url)"
            if [ "${OPERATION}" = force-release ]; then status=forced-release; else status=released; fi
          else
            status=existing-release
          fi
          printf 'status=%s\neffective_release_tag=%s\nrelease_url=%s\n' "${status}" "${EFFECTIVE_TAG}" "${release_url}" >> "${GITHUB_OUTPUT}"

  summary:
    name: Summarize ${{ inputs.library }}
    needs: [plan, build, apple, publish]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.apple.result == 'success' || needs.apple.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.summary.outputs.status }}
      effective_release_tag: ${{ steps.summary.outputs.effective_release_tag }}
      release_url: ${{ steps.summary.outputs.release_url }}
      artifact_manifest: ${{ steps.summary.outputs.artifact_manifest }}
    steps:
      - id: summary
        env:
          ARTIFACT_MANIFEST: ${{ needs.plan.outputs.artifact_manifest }}
          OPERATION: ${{ inputs.operation }}
          PLAN_STATUS: ${{ needs.plan.outputs.release_status }}
          PLAN_TAG: ${{ needs.plan.outputs.effective_release_tag }}
          PLAN_URL: ${{ needs.plan.outputs.release_url }}
          PUBLISH_STATUS: ${{ needs.publish.outputs.status }}
          PUBLISH_TAG: ${{ needs.publish.outputs.effective_release_tag }}
          PUBLISH_URL: ${{ needs.publish.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          status="${PLAN_STATUS}"
          tag="${PLAN_TAG}"
          release_url="${PLAN_URL}"
          if [ -n "${PUBLISH_STATUS}" ]; then
            status="${PUBLISH_STATUS}"
            tag="${PUBLISH_TAG}"
            release_url="${PUBLISH_URL}"
          fi
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          printf 'effective_release_tag=%s\nrelease_url=%s\n' "${tag}" "${release_url}" >> "${GITHUB_OUTPUT}"
          printf 'artifact_manifest=%s\n' "${ARTIFACT_MANIFEST}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Native build result'
            echo
            echo "Operation: \`${OPERATION}\`"
            echo "Status: \`${status}\`"
            echo
            echo 'Artifact manifest:'
            echo '```json'
            echo "${ARTIFACT_MANIFEST}"
            echo '```'
            echo
            if [ -n "${tag}" ]; then echo "Effective release tag: \`${tag}\`"; fi
            if [ -n "${release_url}" ]; then echo "Release URL: ${release_url}"; fi
          } >> "${GITHUB_STEP_SUMMARY}"
