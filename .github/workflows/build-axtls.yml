name: Build axTLS static libraries

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - axtls/**
      - .github/actions/build-native-library/action.yml
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-axtls.yml

env:
  AXTLS_VERSION: 2.1.5
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.1 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/axtls -B /sources/axtls/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja &&
              cmake --build /sources/axtls/build/${{ matrix.project }} &&
              cmake --install /sources/axtls/build/${{ matrix.project }} --prefix /sources/axtls/build/${{ matrix.project }}/install &&
              bash /sources/axtls/scripts/package-artifact.sh \
                /sources/axtls/build/${{ matrix.project }} \
                /sources/axtls/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-${{ matrix.project }}
          path: axtls/build/${{ matrix.project }}/axtls-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        uses: ./.github/actions/build-native-library
        with:
          source-dir: axtls
          build-dir: axtls/build/windows-${{ matrix.arch }}
          install-dir: axtls/build/windows-${{ matrix.arch }}/install
          platform-arch: windows/${{ matrix.arch }}
          generator: Visual Studio 17 2022
          cmake-args: -A ${{ matrix.cmake_platform }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          package-script: axtls/scripts/package-artifact.sh

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 axtls/build/windows-${{ matrix.arch }}/axtls-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-windows-${{ matrix.arch }}
          path: axtls/build/windows-${{ matrix.arch }}/axtls-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Build static libraries
        run: |
          cmake -S axtls -B axtls/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build axtls/build/android-arm64-v8a
          cmake --install axtls/build/android-arm64-v8a --prefix axtls/build/android-arm64-v8a/install
          bash axtls/scripts/package-artifact.sh axtls/build/android-arm64-v8a axtls/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-android-arm64-v8a
          path: axtls/build/android-arm64-v8a/axtls-*.tar.gz

  build-apple:
    name: Build and package Apple arm64 artifacts
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build macOS static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: axtls
          build-dir: axtls/build/macos-arm64
          install-dir: axtls/build/macos-arm64/install
          platform-arch: macos/arm64
          generator: Ninja
          cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
          package-script: axtls/scripts/package-artifact.sh

      - name: Build iOS device static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: axtls
          build-dir: axtls/build/ios-arm64
          install-dir: axtls/build/ios-arm64/install
          platform-arch: ios/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: axtls/scripts/package-artifact.sh

      - name: Build iOS simulator static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: axtls
          build-dir: axtls/build/ios-simulator-arm64
          install-dir: axtls/build/ios-simulator-arm64/install
          platform-arch: ios-simulator/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: axtls/scripts/package-artifact.sh

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library axtls/build/ios-arm64/install/lib/libaxtls.a -headers axtls/build/ios-arm64/install/include \
            -library axtls/build/ios-simulator-arm64/install/lib/libaxtls.a -headers axtls/build/ios-simulator-arm64/install/include \
            -output axtls/build/axtls-ios.xcframework
          ditto -c -k --sequesterRsrc --keepParent axtls/build/axtls-ios.xcframework axtls/build/axtls-ios.xcframework.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-macos-arm64
          path: axtls/build/macos-arm64/axtls-*.tar.gz

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-ios-arm64
          path: axtls/build/ios-arm64/axtls-*.tar.gz

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-ios-simulator-arm64
          path: axtls/build/ios-simulator-arm64/axtls-*.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: axtls-ios-xcframework
          path: axtls/build/axtls-ios.xcframework.zip
