name: Release sqlite3-see

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Optional authenticated SQLite SEE source archive URL. Prefer the SQLITE_SEE_URL secret.
        required: false

jobs:
  release:
    name: Build sqlite3-see
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip

      - name: Fetch sources
        working-directory: sqlite3-see
        env:
          SQLITE_SEE_URL: ${{ secrets.SQLITE_SEE_URL || inputs.source_url }}
        run: ./fetch.sh

      - name: Build and install
        working-directory: sqlite3-see
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build/cmake
          cmake --install build/cmake

      - name: Package artifact
        working-directory: sqlite3-see
        run: ./scripts/package-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sqlite3-see-3.32.3
          path: sqlite3-see/dist/*.tar.gz
