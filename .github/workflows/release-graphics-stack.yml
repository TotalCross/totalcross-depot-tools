name: Release graphics stack

on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated components or all
        default: all
        required: true
        type: string
      publish:
        description: Publish separate releases after dry-run validation
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.components.outputs.value }}
    steps:
      - id: components
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          case ",${COMPONENTS}," in *",all,"*|*",zlib,"*|*",zlib-ng,"*|*",minizip,"*|*",minizip-ng,"*|*",libpng,"*|*",libjpeg,"*|*",libjpeg-turbo,"*|*",skia,"*) ;; *) echo "unknown component selection: ${COMPONENTS}" >&2; exit 1;; esac
          echo "value=${COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "## Graphics-stack dry run" >> "$GITHUB_STEP_SUMMARY"
          echo "components: ${COMPONENTS}; publish: ${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"
  zlib:
    needs: validate
    if: contains(format(',{0},', needs.validate.outputs.components), ',zlib,') || needs.validate.outputs.components == 'all'
    uses: ./.github/workflows/build-zlib.yml
  zlib-ng:
    needs: validate
    if: contains(format(',{0},', needs.validate.outputs.components), ',zlib-ng,') || needs.validate.outputs.components == 'all'
    uses: ./.github/workflows/build-zlib-ng.yml
  minizip:
    needs: [validate, zlib]
    if: always() && (contains(format(',{0},', needs.validate.outputs.components), ',minizip,') || needs.validate.outputs.components == 'all')
    uses: ./.github/workflows/build-minizip.yml
  minizip-ng:
    needs: [validate, zlib-ng]
    if: always() && (contains(format(',{0},', needs.validate.outputs.components), ',minizip-ng,') || needs.validate.outputs.components == 'all')
    uses: ./.github/workflows/build-minizip-ng.yml
  libpng:
    needs: [validate, zlib-ng]
    if: contains(format(',{0},', needs.validate.outputs.components), ',libpng,') || needs.validate.outputs.components == 'all'
    uses: ./.github/workflows/build-libpng.yml
  libjpeg:
    needs: validate
    if: contains(format(',{0},', needs.validate.outputs.components), ',libjpeg,') || needs.validate.outputs.components == 'all'
    uses: ./.github/workflows/build-libjpeg.yml
  libjpeg-turbo:
    needs: validate
    if: contains(format(',{0},', needs.validate.outputs.components), ',libjpeg-turbo,') || needs.validate.outputs.components == 'all'
    uses: ./.github/workflows/build-libjpeg-turbo.yml
  skia:
    needs: [validate, zlib-ng, libpng]
    if: always() && (contains(format(',{0},', needs.validate.outputs.components), ',skia,') || needs.validate.outputs.components == 'all')
    uses: ./.github/workflows/build-skia.yml
  publish:
    needs: [validate, zlib, zlib-ng, minizip, minizip-ng, libpng, libjpeg, libjpeg-turbo, skia]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Publication is intentionally guarded until a dry run has verified every selected artifact manifest." >&2
          exit 1
