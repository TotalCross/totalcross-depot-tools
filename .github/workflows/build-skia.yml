# SPDX-License-Identifier: MIT
name: Build Skia static libraries

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - skia/**
      - deps.yml
      - .github/scripts/verify-windows-static-runtime.ps1
      - zlib-ng/fetch.sh
      - zlib-ng/manifest.yml
      - libpng/fetch.sh
      - libpng/manifest.yml
      - .github/workflows/build-skia.yml

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  EMSCRIPTEN_VERSION: 2.0.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ github.token }}
  SKIA_DIAGNOSTICS_ARCHIVE: skia-build-diagnostics-158dc9d7.tar.gz
  SKIA_DIAGNOSTICS_MODE: summary
  SKIA_USE_CCACHE: 1

# Ccache validates individual compiler inputs. Completed snapshots are restored
# before partial snapshots; each revision gets an immutable completed snapshot.

jobs:
  prepare-skia-sources-linux:
    name: Prepare Skia source dependencies (Linux)
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.skia-source-cache-key.outputs.cache-key }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Compute Skia source cache key
        id: skia-source-cache-key
        run: |
          key_hash=$(
            git rev-parse \
              HEAD:skia/manifest.json \
              HEAD:skia/scripts/fetch-source.sh \
              HEAD:skia/scripts/common.sh |
            git hash-object --stdin
          )
          echo "cache-key=skia-source-deps-linux-${key_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore Skia source archive cache
        id: skia-source-cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ steps.skia-source-cache-key.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Fetch pinned Skia sources
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        working-directory: skia
        run: ./scripts/fetch-source.sh

      - name: Sync Skia dependencies
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache/bin
          cat > skia/.source-cache/bin/python <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$@"
          EOF
          chmod +x skia/.source-cache/bin/python
          cd skia/skia
          PATH="${GITHUB_WORKSPACE}/skia/.source-cache/bin:${GITHUB_WORKSPACE}/skia/depot_tools:${PATH}" python3 tools/git-sync-deps

      - name: Package Skia source archive
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude='.git' --exclude='*/.git' -C skia -cf skia/.source-cache/skia-source.tar skia

  prepare-skia-sources-windows:
    name: Prepare Skia source dependencies (Windows)
    runs-on: windows-2022
    outputs:
      cache-key: ${{ steps.skia-source-cache-key.outputs.cache-key }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Compute Skia source cache key
        id: skia-source-cache-key
        run: |
          key_hash=$(
            git rev-parse \
              HEAD:skia/manifest.json \
              HEAD:skia/scripts/fetch-source.sh \
              HEAD:skia/scripts/common.sh |
            git hash-object --stdin
          )
          echo "cache-key=skia-source-deps-windows-${key_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore Skia source archive cache
        id: skia-source-cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ steps.skia-source-cache-key.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Fetch pinned Skia sources
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        working-directory: skia
        run: ./scripts/fetch-source.sh

      - name: Sync Skia dependencies
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache/bin
          cat > skia/.source-cache/bin/python <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$@"
          EOF
          chmod +x skia/.source-cache/bin/python
          cd skia/skia
          PATH="${GITHUB_WORKSPACE}/skia/.source-cache/bin:${GITHUB_WORKSPACE}/skia/depot_tools:${PATH}" python3 tools/git-sync-deps

      - name: Package Skia source archive
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache
          tar --dereference --exclude='.git' --exclude='*/.git' -C skia -cf skia/.source-cache/skia-source.tar skia

  prepare-skia-sources-macos:
    name: Prepare Skia source dependencies (macOS)
    runs-on: macos-15
    outputs:
      cache-key: ${{ steps.skia-source-cache-key.outputs.cache-key }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Compute Skia source cache key
        id: skia-source-cache-key
        run: |
          key_hash=$(
            git rev-parse \
              HEAD:skia/manifest.json \
              HEAD:skia/scripts/fetch-source.sh \
              HEAD:skia/scripts/common.sh |
            git hash-object --stdin
          )
          echo "cache-key=skia-source-deps-macos-${key_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore Skia source archive cache
        id: skia-source-cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ steps.skia-source-cache-key.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Fetch pinned Skia sources
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        working-directory: skia
        run: ./scripts/fetch-source.sh

      - name: Sync Skia dependencies
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache/bin
          cat > skia/.source-cache/bin/python <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$@"
          EOF
          chmod +x skia/.source-cache/bin/python
          cd skia/skia
          PATH="${GITHUB_WORKSPACE}/skia/.source-cache/bin:${GITHUB_WORKSPACE}/skia/depot_tools:${PATH}" python3 tools/git-sync-deps

      - name: Package Skia source archive
        if: steps.skia-source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p skia/.source-cache
          tar --exclude='.git' --exclude='*/.git' -C skia -cf skia/.source-cache/skia-source.tar skia

  build-linux:
    name: Build ${{ matrix.platform_arch }}
    needs: prepare-skia-sources-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            image: totalcross/skia-linux-amd64:v2.0.4
            gn_image: totalcross/skia-linux-amd64:v2.0.4
            runner: ubuntu-22.04
            build_project: linux-amd64
            docker_platform: linux/amd64
            gn_docker_platform: linux/amd64
            platform_arch: linux/x86_64
            artifact_suffix: linux-x86_64
            arch: x86_64
            script: build-linux-x86_64.sh
            use_cross_toolchain: false
            use_gn_container: false
            use_qemu: false
          - project: linux-arm64
            image: totalcross/skia-linux-amd64:v2.0.4
            gn_image: totalcross/skia-linux-amd64:v2.0.4
            runner: ubuntu-22.04
            build_project: linux-amd64
            docker_platform: linux/amd64
            gn_docker_platform: linux/amd64
            platform_arch: linux/aarch64
            artifact_suffix: linux-aarch64
            arch: aarch64
            script: build-linux-aarch64.sh
            use_cross_toolchain: true
            use_gn_container: false
            use_qemu: false
          - project: linux-arm32v7
            image: totalcross/linux-arm32v7:v2.0.4
            gn_image: totalcross/skia-linux-amd64:v2.0.4
            runner: ubuntu-22.04
            build_project: linux-arm32v7
            docker_platform: linux/arm/v7
            gn_docker_platform: linux/amd64
            platform_arch: linux/armv7l
            artifact_suffix: linux-armv7l
            arch: armv7l
            script: build-linux-armv7l.sh
            use_cross_toolchain: false
            use_gn_container: false
            use_qemu: true

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache/skia-${{ matrix.project }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.project }}-complete-${{ github.sha }}
          restore-keys: |
            skia-ccache-v1-${{ runner.os }}-${{ matrix.project }}-complete-
            skia-ccache-v1-${{ runner.os }}-${{ matrix.project }}-partial-

      - name: Allow multiarch
        if: ${{ matrix.use_qemu || matrix.use_gn_container }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Configure and report ccache
        run: |
          mkdir -p "${HOME}/.cache/ccache/skia-${{ matrix.project }}"
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "${HOME}/.cache/ccache/skia-${{ matrix.project }}:/ccache" \
            -e CCACHE_DIR=/ccache \
            -t ${{ matrix.image }} \
            bash -lc 'ccache --set-config=max_size=2G && ccache --show-stats'

      - name: Fetch zlib-ng/libpng prebuilts
        run: bash skia/scripts/fetch-prebuilt-deps.sh linux ${{ matrix.arch }}

      - name: Restore Skia source archive cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-linux.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Fetch native depot_tools
        working-directory: skia
        run: ./scripts/fetch-source.sh depot_tools

      - name: Generate Ninja files
        env:
          SKIA_ONLY_GN_GEN: 1
          SKIA_SKIP_DEPS_SYNC: 1
        run: |
          mkdir -p "${HOME}/.cache/ccache/skia-${{ matrix.project }}"
          docker run \
            --platform ${{ matrix.gn_docker_platform }} \
            -v "${PWD}:${PWD}" \
            -v "${HOME}/.cache/ccache/skia-${{ matrix.project }}:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e SKIA_USE_CCACHE=1 \
            -e SKIA_ONLY_GN_GEN=1 \
            -e SKIA_SKIP_DEPS_SYNC=1 \
            -w "${PWD}" \
            -t ${{ matrix.gn_image }} \
            bash -lc "
              command -v python3
              command -v ccache
              command -v ninja || command -v gn
              bash skia/scripts/${{ matrix.script }}
            "

      - name: Build static library
        run: |
          mkdir -p "${HOME}/.cache/ccache/skia-${{ matrix.project }}"
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:${PWD}" \
            -v "${HOME}/.cache/ccache/skia-${{ matrix.project }}:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e SKIA_USE_CCACHE=1 \
            -e SKIA_SKIP_GN_GEN=1 \
            -e SKIA_SKIP_DEPS_SYNC=1 \
            -w "${PWD}" \
            -t ${{ matrix.image }} \
            bash -lc "
              command -v ccache
              bash skia/scripts/${{ matrix.script }}
            "

      - name: Save complete ccache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache/skia-${{ matrix.project }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.project }}-complete-${{ github.sha }}

      - name: Save partial ccache
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache/skia-${{ matrix.project }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.project }}-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print build summary on failure
        if: failure()
        run: |
          find skia/dist/diagnostics -type f -name 'build-summary.json' -print -exec cat {} \; || true

      - name: Report ccache result
        if: always()
        run: |
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "${HOME}/.cache/ccache/skia-${{ matrix.project }}:/ccache" \
            -e CCACHE_DIR=/ccache \
            -t ${{ matrix.image }} \
            bash -lc 'ccache --show-stats || true'

      - name: Verify artifacts
        run: |
          test -f "skia/dist/libskia-${{ matrix.artifact_suffix }}.a"
          test -f "skia/dist/build_config_manifest-${{ matrix.artifact_suffix }}.md"
          grep -Eq 'skia_use_system_zlib[[:space:]]*=[[:space:]]*true' "skia/dist/build_config_manifest-${{ matrix.artifact_suffix }}.md"
          grep -Eq 'skia_use_system_libpng[[:space:]]*=[[:space:]]*true' "skia/dist/build_config_manifest-${{ matrix.artifact_suffix }}.md"
          ! find skia/dist -maxdepth 1 -name '*.so' | grep -q .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-${{ matrix.project }}
          path: |
            skia/dist/libskia-${{ matrix.artifact_suffix }}.a
            skia/dist/build_config_manifest-${{ matrix.artifact_suffix }}.md

      - name: Upload full diagnostics
        if: ${{ failure() || env.SKIA_DIAGNOSTICS_MODE == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: skia-diagnostics-${{ matrix.artifact_suffix }}
          path: skia/dist/diagnostics

  build-android:
    name: Build android/arm64-v8a
    needs: prepare-skia-sources-linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache/skia-android-arm64-v8a
          key: skia-ccache-v1-${{ runner.os }}-android-arm64-v8a-complete-${{ github.sha }}
          restore-keys: |
            skia-ccache-v1-${{ runner.os }}-android-arm64-v8a-complete-
            skia-ccache-v1-${{ runner.os }}-android-arm64-v8a-partial-

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build rsync

      - name: Configure and report ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-android-arm64-v8a
        run: |
          ccache --set-config=max_size=2G
          ccache --show-stats || true

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Fetch zlib-ng/libpng prebuilts
        run: bash skia/scripts/fetch-prebuilt-deps.sh android arm64-v8a

      - name: Restore Skia source archive cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-linux.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Fetch native depot_tools
        working-directory: skia
        run: ./scripts/fetch-source.sh depot_tools

      - name: Build static library
        working-directory: skia
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-android-arm64-v8a
          SKIA_SKIP_DEPS_SYNC: 1
        run: ./scripts/build-android-arm64.sh

      - name: Save complete ccache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-android-arm64-v8a
          key: skia-ccache-v1-${{ runner.os }}-android-arm64-v8a-complete-${{ github.sha }}

      - name: Save partial ccache
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-android-arm64-v8a
          key: skia-ccache-v1-${{ runner.os }}-android-arm64-v8a-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print build summary on failure
        if: failure()
        run: |
          find skia/dist/diagnostics -type f -name 'build-summary.json' -print -exec cat {} \; || true

      - name: Verify artifacts
        run: |
          test -f skia/dist/libskia-android-arm64-v8a.a
          test -f skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'is_component_build[[:space:]]*=[[:space:]]*false' skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -q "${ANDROID_NDK_VERSION}" skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'skia_use_system_zlib[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'skia_use_system_libpng[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'skia_use_freetype[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'skia_enable_fontmgr_android[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-android-arm64-v8a.md
          grep -Eq 'skia_fontmgr_factory[[:space:]]*=[[:space:]]*":fontmgr_android_factory"' skia/dist/build_config_manifest-android-arm64-v8a.md
          ! find skia/dist -maxdepth 1 -name '*.so' | grep -q .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-android-arm64-v8a
          path: |
            skia/dist/libskia-android-arm64-v8a.a
            skia/dist/build_config_manifest-android-arm64-v8a.md

      - name: Upload diagnostics
        if: ${{ failure() || env.SKIA_DIAGNOSTICS_MODE == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: skia-diagnostics-android-arm64-v8a
          path: skia/dist/diagnostics

  build-wasm:
    name: Build wasm/wasm32
    needs: prepare-skia-sources-linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache/skia-wasm-wasm32
          key: skia-ccache-v1-${{ runner.os }}-wasm-wasm32-complete-${{ github.sha }}
          restore-keys: |
            skia-ccache-v1-${{ runner.os }}-wasm-wasm32-complete-
            skia-ccache-v1-${{ runner.os }}-wasm-wasm32-partial-

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build rsync

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Configure ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-wasm-wasm32
        run: |
          ccache --set-config=max_size=2G
          ccache --show-stats || true

      - name: Restore Skia source archive
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-linux.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Fetch native depot_tools
        working-directory: skia
        run: ./scripts/fetch-source.sh depot_tools

      - name: Build static library
        working-directory: skia
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-wasm-wasm32
          SKIA_SKIP_DEPS_SYNC: 1
        run: ./scripts/build-wasm32.sh

      - name: Save complete ccache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-wasm-wasm32
          key: skia-ccache-v1-${{ runner.os }}-wasm-wasm32-complete-${{ github.sha }}

      - name: Save partial ccache
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-wasm-wasm32
          key: skia-ccache-v1-${{ runner.os }}-wasm-wasm32-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print build summary on failure
        if: failure()
        run: |
          find skia/dist/diagnostics -type f -name 'build-summary.json' -print -exec cat {} \; || true

      - name: Verify artifacts
        run: |
          test -f skia/dist/libskia-wasm32.a
          test -f skia/dist/build_config_manifest-wasm-wasm32.md
          grep -Eq 'target_cpu[[:space:]]*=[[:space:]]*"wasm"' skia/dist/build_config_manifest-wasm-wasm32.md
          grep -Eq 'skia_use_webgl[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-wasm-wasm32.md
          grep -Eq 'skia_gl_standard[[:space:]]*=[[:space:]]*"webgl"' skia/dist/build_config_manifest-wasm-wasm32.md
          ! find skia/dist -maxdepth 1 -name '*.so' | grep -q .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-wasm-wasm32
          path: |
            skia/dist/libskia-wasm32.a
            skia/dist/build_config_manifest-wasm-wasm32.md

      - name: Upload diagnostics
        if: ${{ failure() || env.SKIA_DIAGNOSTICS_MODE == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: skia-diagnostics-wasm-wasm32
          path: skia/dist/diagnostics

  build-apple:
    name: Build ${{ matrix.target }}
    needs: prepare-skia-sources-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            platform: macos
            script: build-macos-arm64.sh
          - target: ios-arm64
            platform: ios
            script: build-ios-arm64.sh
          - target: ios-simulator-arm64
            platform: ios-simulator
            script: build-ios-simulator-arm64.sh
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache/skia-${{ matrix.target }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.target }}-complete-${{ github.sha }}
          restore-keys: |
            skia-ccache-v1-${{ runner.os }}-${{ matrix.target }}-complete-
            skia-ccache-v1-${{ runner.os }}-${{ matrix.target }}-partial-

      - name: Verify or install build tools
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Configure ccache
        run: |
          CCACHE_DIR="${GITHUB_WORKSPACE}/.cache/ccache/skia-${{ matrix.target }}" ccache --set-config=max_size=2G
          CCACHE_DIR="${GITHUB_WORKSPACE}/.cache/ccache/skia-${{ matrix.target }}" ccache --show-stats || true

      - name: Fetch zlib-ng/libpng prebuilt dependencies
        run: bash skia/scripts/fetch-prebuilt-deps.sh ${{ matrix.platform }} arm64

      - name: Restore Skia source archive cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-macos.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Fetch native depot_tools
        working-directory: skia
        run: ./scripts/fetch-source.sh depot_tools

      - name: Build static library
        id: build-static-library
        working-directory: skia
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-${{ matrix.target }}
        run: ./scripts/${{ matrix.script }}

      - name: Save complete ccache
        if: ${{ steps.build-static-library.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-${{ matrix.target }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.target }}-complete-${{ github.sha }}

      - name: Save partial ccache
        if: ${{ (failure() || cancelled()) && steps.build-static-library.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-${{ matrix.target }}
          key: skia-ccache-v1-${{ runner.os }}-${{ matrix.target }}-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print build summary on failure
        if: failure()
        run: |
          find skia/dist/diagnostics -type f -name 'build-summary.json' -print -exec cat {} \; || true

      - name: Verify artifacts
        run: |
          test -f "skia/dist/libskia-${{ matrix.target }}.a"
          test -f "skia/dist/build_config_manifest-${{ matrix.target }}.md"
          grep -Eq 'skia_use_system_zlib[[:space:]]*=[[:space:]]*true' "skia/dist/build_config_manifest-${{ matrix.target }}.md"
          grep -Eq 'skia_use_system_libpng[[:space:]]*=[[:space:]]*true' "skia/dist/build_config_manifest-${{ matrix.target }}.md"
          ! find skia/dist -maxdepth 1 -name '*.so' | grep -q .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-${{ matrix.target }}
          path: |
            skia/dist/libskia-${{ matrix.target }}.a
            skia/dist/build_config_manifest-${{ matrix.target }}.md

      - name: Upload diagnostics
        if: ${{ failure() || env.SKIA_DIAGNOSTICS_MODE == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: skia-diagnostics-${{ matrix.target }}
          path: skia/dist/diagnostics

  package-apple-artifacts:
    name: Package Apple XCFramework and headers
    needs:
      - prepare-skia-sources-macos
      - build-apple
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore Skia source archive cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-macos.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-macos-arm64
          path: skia/dist

      - name: Download iOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-ios-arm64
          path: skia/dist

      - name: Download iOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-ios-simulator-arm64
          path: skia/dist

      - name: Stage development headers and package artifacts
        working-directory: skia
        run: |
          source ./scripts/common.sh
          stage_dev_subset
          ./scripts/package-ios-xcframework.sh
          ./scripts/package-dev-bundle.sh

      - name: Upload iOS package artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-ios-package
          path: |
            skia/dist/libskia-ios-arm64.a
            skia/dist/libskia-ios-simulator-arm64.a
            skia/dist/skia-ios.xcframework.zip
            skia/dist/skia-dev-headers-158dc9d7.zip
            skia/dist/build_config_manifest-ios-arm64.md
            skia/dist/build_config_manifest-ios-simulator-arm64.md

  build-windows:
    name: Build windows/${{ matrix.arch }}
    needs: prepare-skia-sources-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            script: build-windows-x86.sh
            runner: windows-2022
          - arch: x64
            script: build-windows-x64.sh
            runner: windows-2022
          - arch: arm64
            script: build-windows-arm64.sh
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache/skia-windows-${{ matrix.arch }}
          key: skia-ccache-v1-${{ runner.os }}-windows-${{ matrix.arch }}-complete-${{ github.sha }}
          restore-keys: |
            skia-ccache-v1-${{ runner.os }}-windows-${{ matrix.arch }}-complete-
            skia-ccache-v1-${{ runner.os }}-windows-${{ matrix.arch }}-partial-

      - name: Install build tools
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { choco install ccache -y --no-progress --limit-output --ignore-checksums }

      - name: Configure ccache
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-windows-${{ matrix.arch }}
        run: |
          ccache --set-config=max_size=2G
          ccache --show-stats || true

      - name: Fetch zlib-ng/libpng prebuilts
        shell: bash
        run: bash skia/scripts/fetch-prebuilt-deps.sh windows ${{ matrix.arch }}

      - name: Restore Skia source archive cache
        uses: actions/cache@v5
        with:
          path: skia/.source-cache
          key: ${{ needs.prepare-skia-sources-windows.outputs.cache-key }}
          enableCrossOsArchive: true

      - name: Extract Skia source archive
        shell: bash
        run: |
          test -f skia/.source-cache/skia-source.tar
          tar -C skia -xf skia/.source-cache/skia-source.tar

      - name: Fetch native depot_tools
        shell: bash
        working-directory: skia
        run: ./scripts/fetch-source.sh depot_tools

      - name: Build static library
        shell: bash
        working-directory: skia
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/skia-windows-${{ matrix.arch }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
        run: ./scripts/${{ matrix.script }}

      - name: Save complete ccache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-windows-${{ matrix.arch }}
          key: skia-ccache-v1-${{ runner.os }}-windows-${{ matrix.arch }}-complete-${{ github.sha }}

      - name: Save partial ccache
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache/skia-windows-${{ matrix.arch }}
          key: skia-ccache-v1-${{ runner.os }}-windows-${{ matrix.arch }}-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print build summary on failure
        if: failure()
        shell: bash
        run: |
          find skia/dist/diagnostics -type f -name 'build-summary.json' -print -exec cat {} \; || true

      - name: Verify artifacts
        shell: bash
        run: |
          test -f skia/dist/libskia-windows-${{ matrix.arch }}.lib
          test -f skia/dist/build_config_manifest-windows-${{ matrix.arch }}.md
          grep -Eq 'skia_use_system_zlib[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-windows-${{ matrix.arch }}.md
          grep -Eq 'skia_use_system_libpng[[:space:]]*=[[:space:]]*true' skia/dist/build_config_manifest-windows-${{ matrix.arch }}.md
          grep -Eq 'extra_cflags.*"/MT"' skia/dist/build_config_manifest-windows-${{ matrix.arch }}.md
          ! find skia/dist -maxdepth 1 -name '*.so' | grep -q .

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 skia/dist/libskia-windows-${{ matrix.arch }}.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-windows-${{ matrix.arch }}
          path: |
            skia/dist/libskia-windows-${{ matrix.arch }}.lib
            skia/dist/build_config_manifest-windows-${{ matrix.arch }}.md

      - name: Upload diagnostics
        if: ${{ failure() || env.SKIA_DIAGNOSTICS_MODE == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: skia-diagnostics-windows-${{ matrix.arch }}
          path: skia/dist/diagnostics

  package-release-assets:
    name: Package release assets
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-android
      - build-wasm
      - package-apple-artifacts
      - build-windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          ! find release-assets -maxdepth 1 -name '*.so' | grep -q .

          mkdir -p release-assets/.diagnostics
          if [ -d release-assets/diagnostics ]; then
            find release-assets/diagnostics -mindepth 1 -maxdepth 1 -exec mv {} release-assets/.diagnostics/ \;
            rm -rf release-assets/diagnostics
          fi

          while IFS= read -r -d '' diagnostics_dir; do
            mv "${diagnostics_dir}" release-assets/.diagnostics/
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type d ! -name '.diagnostics' -print0)

          if find release-assets/.diagnostics -mindepth 1 -print -quit | grep -q .; then
            tar -C release-assets/.diagnostics -czf "release-assets/${SKIA_DIAGNOSTICS_ARCHIVE}" .
          fi
          rm -rf release-assets/.diagnostics

          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 shasum -a 256 | sed 's#  \./#  #' | sort -k 2 > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: skia-release-assets
          path: release-assets/*
