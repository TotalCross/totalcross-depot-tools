name: Build zlib-ng static libraries

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - zlib-ng/**
      - .github/actions/build-native-library/action.yml
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-zlib-ng.yml

env:
  ZLIB_NG_VERSION: 2.1.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static libraries
        uses: ./.github/actions/build-native-library
        with:
          source-dir: zlib-ng
          build-dir: zlib-ng/build/${{ matrix.project }}
          install-dir: zlib-ng/build/${{ matrix.project }}/install
          platform-arch: ${{ matrix.platform_arch }}
          docker-image: totalcross/${{ matrix.project }}:v2.0.1
          docker-platform: ${{ matrix.docker_platform }}
          package-script: zlib-ng/scripts/package-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-${{ matrix.project }}
          path: zlib-ng/build/${{ matrix.project }}/zlib-ng-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        uses: ./.github/actions/build-native-library
        with:
          source-dir: zlib-ng
          build-dir: zlib-ng/build/windows-${{ matrix.arch }}
          install-dir: zlib-ng/build/windows-${{ matrix.arch }}/install
          platform-arch: windows/${{ matrix.arch }}
          generator: Visual Studio 17 2022
          cmake-args: -A ${{ matrix.cmake_platform }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          package-script: zlib-ng/scripts/package-artifact.sh

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 zlib-ng/build/windows-${{ matrix.arch }}/zlib-ng-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-windows-${{ matrix.arch }}
          path: zlib-ng/build/windows-${{ matrix.arch }}/zlib-ng-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Build static libraries
        run: |
          cmake -S zlib-ng -B zlib-ng/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build zlib-ng/build/android-arm64-v8a
          cmake --install zlib-ng/build/android-arm64-v8a --prefix zlib-ng/build/android-arm64-v8a/install
          bash zlib-ng/scripts/package-artifact.sh zlib-ng/build/android-arm64-v8a zlib-ng/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-android-arm64-v8a
          path: zlib-ng/build/android-arm64-v8a/zlib-ng-*.tar.gz

  build-apple:
    name: Build and package Apple arm64 artifacts
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build macOS static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: zlib-ng
          build-dir: zlib-ng/build/macos-arm64
          install-dir: zlib-ng/build/macos-arm64/install
          platform-arch: macos/arm64
          generator: Ninja
          cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
          package-script: zlib-ng/scripts/package-artifact.sh

      - name: Build iOS device static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: zlib-ng
          build-dir: zlib-ng/build/ios-arm64
          install-dir: zlib-ng/build/ios-arm64/install
          platform-arch: ios/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: zlib-ng/scripts/package-artifact.sh

      - name: Build iOS simulator static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: zlib-ng
          build-dir: zlib-ng/build/ios-simulator-arm64
          install-dir: zlib-ng/build/ios-simulator-arm64/install
          platform-arch: ios-simulator/arm64
          generator: Xcode
          cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: zlib-ng/scripts/package-artifact.sh

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library zlib-ng/build/ios-arm64/install/lib/libz.a -headers zlib-ng/build/ios-arm64/install/include \
            -library zlib-ng/build/ios-simulator-arm64/install/lib/libz.a -headers zlib-ng/build/ios-simulator-arm64/install/include \
            -output zlib-ng/build/zlib-ng-ios.xcframework
          ditto -c -k --sequesterRsrc --keepParent zlib-ng/build/zlib-ng-ios.xcframework zlib-ng/build/zlib-ng-ios.xcframework.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-macos-arm64
          path: zlib-ng/build/macos-arm64/zlib-ng-*.tar.gz

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-ios-arm64
          path: zlib-ng/build/ios-arm64/zlib-ng-*.tar.gz

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-ios-simulator-arm64
          path: zlib-ng/build/ios-simulator-arm64/zlib-ng-*.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-ios-xcframework
          path: zlib-ng/build/zlib-ng-ios.xcframework.zip
