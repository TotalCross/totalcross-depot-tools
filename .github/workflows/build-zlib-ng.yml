name: Build zlib-ng static libraries

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - zlib-ng/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-zlib-ng.yml
  pull_request:
    branches: [ main, master ]
    paths:
      - zlib-ng/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-zlib-ng.yml

env:
  ZLIB_NG_VERSION: 2.1.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.0 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/zlib-ng -B /sources/zlib-ng/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja &&
              cmake --build /sources/zlib-ng/build/${{ matrix.project }} &&
              cmake --install /sources/zlib-ng/build/${{ matrix.project }} --prefix /sources/zlib-ng/build/${{ matrix.project }}/install &&
              bash /sources/zlib-ng/scripts/package-artifact.sh \
                /sources/zlib-ng/build/${{ matrix.project }} \
                /sources/zlib-ng/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-${{ matrix.project }}
          path: zlib-ng/build/${{ matrix.project }}/zlib-ng-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        shell: bash
        run: |
          cmake -S zlib-ng -B zlib-ng/build/windows-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.cmake_platform }}
          cmake --build zlib-ng/build/windows-${{ matrix.arch }} --config Release
          cmake --install zlib-ng/build/windows-${{ matrix.arch }} --config Release --prefix zlib-ng/build/windows-${{ matrix.arch }}/install
          bash zlib-ng/scripts/package-artifact.sh zlib-ng/build/windows-${{ matrix.arch }} zlib-ng/build/windows-${{ matrix.arch }}/install windows/${{ matrix.arch }}

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 zlib-ng/build/windows-${{ matrix.arch }}/zlib-ng-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-windows-${{ matrix.arch }}
          path: zlib-ng/build/windows-${{ matrix.arch }}/zlib-ng-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Build static libraries
        run: |
          cmake -S zlib-ng -B zlib-ng/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build zlib-ng/build/android-arm64-v8a
          cmake --install zlib-ng/build/android-arm64-v8a --prefix zlib-ng/build/android-arm64-v8a/install
          bash zlib-ng/scripts/package-artifact.sh zlib-ng/build/android-arm64-v8a zlib-ng/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-android-arm64-v8a
          path: zlib-ng/build/android-arm64-v8a/zlib-ng-*.tar.gz

  build-apple:
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            build_dir: macos-arm64
            cmake_generator: Ninja
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: ios
            arch: arm64
            build_dir: ios-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          - platform: ios-simulator
            arch: arm64
            build_dir: ios-simulator-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        run: |
          cmake -S zlib-ng -B zlib-ng/build/${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_args }} \
            -G "${{ matrix.cmake_generator }}"
          cmake --build zlib-ng/build/${{ matrix.build_dir }} --config Release
          cmake --install zlib-ng/build/${{ matrix.build_dir }} --config Release --prefix zlib-ng/build/${{ matrix.build_dir }}/install
          bash zlib-ng/scripts/package-artifact.sh zlib-ng/build/${{ matrix.build_dir }} zlib-ng/build/${{ matrix.build_dir }}/install ${{ matrix.platform }}/${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-${{ matrix.build_dir }}
          path: zlib-ng/build/${{ matrix.build_dir }}/zlib-ng-*.tar.gz

  package-ios:
    name: Package iOS XCFramework
    needs: build-apple
    runs-on: macos-15

    steps:
      - name: Download iOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: zlib-ng-ios-arm64
          path: package-input/ios

      - name: Download iOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: zlib-ng-ios-simulator-arm64
          path: package-input/ios-simulator

      - name: Create XCFramework
        run: |
          mkdir -p package-work package-output
          tar -xzf package-input/ios/zlib-ng-ios-arm64.tar.gz -C package-work
          tar -xzf package-input/ios-simulator/zlib-ng-ios-simulator-arm64.tar.gz -C package-work

          device_root="${PWD}/package-work/zlib-ng/ios/arm64"
          simulator_root="${PWD}/package-work/zlib-ng/ios-simulator/arm64"
          device_lib="$(find "${device_root}/lib" -type f -name "libz.a" | head -n 1)"
          simulator_lib="$(find "${simulator_root}/lib" -type f -name "libz.a" | head -n 1)"

          if [ -z "${device_lib}" ] || [ -z "${simulator_lib}" ]; then
            echo "Unable to locate zlib-ng iOS static libraries" >&2
            exit 1
          fi

          xcodebuild -create-xcframework \
            -library "${device_lib}" -headers "${device_root}/include" \
            -library "${simulator_lib}" -headers "${simulator_root}/include" \
            -output package-output/zlib-ng-ios.xcframework

          cd package-output
          ditto -c -k --sequesterRsrc --keepParent zlib-ng-ios.xcframework zlib-ng-ios.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: zlib-ng-ios-xcframework
          path: package-output/zlib-ng-ios.xcframework.zip
