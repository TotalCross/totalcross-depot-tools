name: Build minizip-ng static libraries

on:
  workflow_call:
    inputs:
      zlib_ng_release_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zlib_ng_release_tag:
        description: Optional zlib-ng release tag to use
        required: false
        type: string
  pull_request:
    branches: [ master ]
    paths:
      - deps.yml
      - minizip-ng/**
      - .github/actions/build-native-library/action.yml
      - .github/scripts/verify-windows-static-runtime.ps1
      - zlib-ng/fetch.sh
      - .github/scripts/read-deps-release.sh
      - .github/workflows/build-minizip-ng.yml

env:
  MINIZIP_NG_VERSION: 4.2.2
  ZLIB_NG_VERSION: 2.1.6
  REQUESTED_ZLIB_NG_RELEASE_TAG: ${{ inputs.zlib_ng_release_tag }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            zlib_platform: linux
            zlib_arch: x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            zlib_platform: linux
            zlib_arch: armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            zlib_platform: linux
            zlib_arch: aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform "${{ matrix.zlib_platform }}" \
            --arch "${{ matrix.zlib_arch }}" \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.1 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/minizip-ng -B /sources/minizip-ng/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DZLIB_DIR=/sources/zlib-ng/local/${{ matrix.zlib_platform }}/${{ matrix.zlib_arch }} \
                -G Ninja &&
              cmake --build /sources/minizip-ng/build/${{ matrix.project }} &&
              cmake --install /sources/minizip-ng/build/${{ matrix.project }} --prefix /sources/minizip-ng/build/${{ matrix.project }}/install &&
              bash /sources/minizip-ng/scripts/package-artifact.sh \
                /sources/minizip-ng/build/${{ matrix.project }} \
                /sources/minizip-ng/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-${{ matrix.project }}
          path: minizip-ng/build/${{ matrix.project }}/minizip-ng-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng prebuilts
        shell: bash
        run: |
          bash zlib-ng/fetch.sh \
            --platform windows \
            --arch ${{ matrix.arch }} \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        uses: ./.github/actions/build-native-library
        with:
          source-dir: minizip-ng
          build-dir: minizip-ng/build/windows-${{ matrix.arch }}
          install-dir: minizip-ng/build/windows-${{ matrix.arch }}/install
          platform-arch: windows/${{ matrix.arch }}
          generator: Visual Studio 17 2022
          cmake-args: -A ${{ matrix.cmake_platform }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DZLIB_DIR=$PWD/zlib-ng/local/windows/${{ matrix.arch }}
          package-script: minizip-ng/scripts/package-artifact.sh

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 minizip-ng/build/windows-${{ matrix.arch }}/minizip-ng-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-windows-${{ matrix.arch }}
          path: minizip-ng/build/windows-${{ matrix.arch }}/minizip-ng-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Fetch zlib-ng prebuilts
        run: |
          bash zlib-ng/fetch.sh \
            --platform android \
            --arch arm64-v8a \
            --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"

      - name: Build static libraries
        run: |
          cmake -S minizip-ng -B minizip-ng/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_DIR="$PWD/zlib-ng/local/android/arm64-v8a" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build minizip-ng/build/android-arm64-v8a
          cmake --install minizip-ng/build/android-arm64-v8a --prefix minizip-ng/build/android-arm64-v8a/install
          bash minizip-ng/scripts/package-artifact.sh minizip-ng/build/android-arm64-v8a minizip-ng/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-android-arm64-v8a
          path: minizip-ng/build/android-arm64-v8a/minizip-ng-*.tar.gz

  build-apple:
    name: Build and package Apple arm64 artifacts
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Fetch zlib-ng Apple prebuilts
        run: |
          for platform in macos ios ios-simulator; do
            bash zlib-ng/fetch.sh \
              --platform "${platform}" \
              --arch arm64 \
              --release-tag "${REQUESTED_ZLIB_NG_RELEASE_TAG:-$(.github/scripts/read-deps-release.sh zlib-ng)}"
          done

      - name: Build macOS static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: minizip-ng
          build-dir: minizip-ng/build/macos-arm64
          install-dir: minizip-ng/build/macos-arm64/install
          platform-arch: macos/arm64
          generator: Ninja
          cmake-args: -DZLIB_DIR=$PWD/zlib-ng/local/macos/arm64 -DCMAKE_OSX_ARCHITECTURES=arm64
          package-script: minizip-ng/scripts/package-artifact.sh

      - name: Build iOS device static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: minizip-ng
          build-dir: minizip-ng/build/ios-arm64
          install-dir: minizip-ng/build/ios-arm64/install
          platform-arch: ios/arm64
          generator: Xcode
          cmake-args: -DZLIB_DIR=$PWD/zlib-ng/local/ios/arm64 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: minizip-ng/scripts/package-artifact.sh

      - name: Build iOS simulator static library
        uses: ./.github/actions/build-native-library
        with:
          source-dir: minizip-ng
          build-dir: minizip-ng/build/ios-simulator-arm64
          install-dir: minizip-ng/build/ios-simulator-arm64/install
          platform-arch: ios-simulator/arm64
          generator: Xcode
          cmake-args: -DZLIB_DIR=$PWD/zlib-ng/local/ios-simulator/arm64 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          package-script: minizip-ng/scripts/package-artifact.sh

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library minizip-ng/build/ios-arm64/install/lib/libminizip.a -headers minizip-ng/build/ios-arm64/install/include \
            -library minizip-ng/build/ios-simulator-arm64/install/lib/libminizip.a -headers minizip-ng/build/ios-simulator-arm64/install/include \
            -output minizip-ng/build/minizip-ng-ios.xcframework
          ditto -c -k --sequesterRsrc --keepParent minizip-ng/build/minizip-ng-ios.xcframework minizip-ng/build/minizip-ng-ios.xcframework.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-macos-arm64
          path: minizip-ng/build/macos-arm64/minizip-ng-*.tar.gz

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-ios-arm64
          path: minizip-ng/build/ios-arm64/minizip-ng-*.tar.gz

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-ios-simulator-arm64
          path: minizip-ng/build/ios-simulator-arm64/minizip-ng-*.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: minizip-ng-ios-xcframework
          path: minizip-ng/build/minizip-ng-ios.xcframework.zip
