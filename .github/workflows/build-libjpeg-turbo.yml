name: Build libjpeg-turbo static libraries

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - libjpeg-turbo/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-libjpeg-turbo.yml
  pull_request:
    branches: [ main, master ]
    paths:
      - libjpeg-turbo/**
      - cmake/TotalCrossWindowsStaticRuntime.cmake
      - .github/scripts/verify-windows-static-runtime.ps1
      - .github/workflows/build-libjpeg-turbo.yml

env:
  LIBJPEG_TURBO_VERSION: 3.1.4.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build ${{ matrix.platform_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: linux-amd64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            platform_arch: linux/x86_64
            use_qemu: false
          - project: linux-arm32v7
            runner: ubuntu-22.04
            docker_platform: linux/arm/v7
            platform_arch: linux/armv7l
            use_qemu: true
          - project: linux-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            platform_arch: linux/aarch64
            use_qemu: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Allow multiarch
        if: ${{ matrix.use_qemu }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static libraries
        run: |
          docker run \
            --platform ${{ matrix.docker_platform }} \
            -v "${PWD}:/sources" \
            -w /sources \
            -t totalcross/${{ matrix.project }}:v2.0.1 \
            bash -lc "
              cmake --version &&
              cmake -S /sources/libjpeg-turbo -B /sources/libjpeg-turbo/build/${{ matrix.project }} \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja &&
              cmake --build /sources/libjpeg-turbo/build/${{ matrix.project }} &&
              cmake --install /sources/libjpeg-turbo/build/${{ matrix.project }} --prefix /sources/libjpeg-turbo/build/${{ matrix.project }}/install &&
              bash /sources/libjpeg-turbo/scripts/package-artifact.sh \
                /sources/libjpeg-turbo/build/${{ matrix.project }} \
                /sources/libjpeg-turbo/build/${{ matrix.project }}/install \
                ${{ matrix.platform_arch }}
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-${{ matrix.project }}
          path: libjpeg-turbo/build/${{ matrix.project }}/libjpeg-turbo-*.tar.gz

  build-windows:
    name: Build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        shell: bash
        run: |
          cmake -S libjpeg-turbo -B libjpeg-turbo/build/windows-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.cmake_platform }}
          cmake --build libjpeg-turbo/build/windows-${{ matrix.arch }} --config Release
          cmake --install libjpeg-turbo/build/windows-${{ matrix.arch }} --config Release --prefix libjpeg-turbo/build/windows-${{ matrix.arch }}/install
          bash libjpeg-turbo/scripts/package-artifact.sh libjpeg-turbo/build/windows-${{ matrix.arch }} libjpeg-turbo/build/windows-${{ matrix.arch }}/install windows/${{ matrix.arch }}

      - name: Verify static MSVC runtime
        shell: pwsh
        run: ./.github/scripts/verify-windows-static-runtime.ps1 libjpeg-turbo/build/windows-${{ matrix.arch }}/libjpeg-turbo-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-windows-${{ matrix.arch }}
          path: libjpeg-turbo/build/windows-${{ matrix.arch }}/libjpeg-turbo-*.tar.gz

  build-android:
    name: Build android/arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify preinstalled Android NDK
        uses: ./.github/actions/setup-android-native

      - name: Build static libraries
        run: |
          cmake -S libjpeg-turbo -B libjpeg-turbo/build/android-arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -G Ninja
          cmake --build libjpeg-turbo/build/android-arm64-v8a
          cmake --install libjpeg-turbo/build/android-arm64-v8a --prefix libjpeg-turbo/build/android-arm64-v8a/install
          bash libjpeg-turbo/scripts/package-artifact.sh libjpeg-turbo/build/android-arm64-v8a libjpeg-turbo/build/android-arm64-v8a/install android/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-android-arm64-v8a
          path: libjpeg-turbo/build/android-arm64-v8a/libjpeg-turbo-*.tar.gz

  build-apple:
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            build_dir: macos-arm64
            cmake_generator: Ninja
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: ios
            arch: arm64
            build_dir: ios-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          - platform: ios-simulator
            arch: arm64
            build_dir: ios-simulator-arm64
            cmake_generator: Xcode
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build static libraries
        run: |
          cmake -S libjpeg-turbo -B libjpeg-turbo/build/${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_args }} \
            -G "${{ matrix.cmake_generator }}"
          cmake --build libjpeg-turbo/build/${{ matrix.build_dir }} --config Release
          cmake --install libjpeg-turbo/build/${{ matrix.build_dir }} --config Release --prefix libjpeg-turbo/build/${{ matrix.build_dir }}/install
          bash libjpeg-turbo/scripts/package-artifact.sh libjpeg-turbo/build/${{ matrix.build_dir }} libjpeg-turbo/build/${{ matrix.build_dir }}/install ${{ matrix.platform }}/${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-${{ matrix.build_dir }}
          path: libjpeg-turbo/build/${{ matrix.build_dir }}/libjpeg-turbo-*.tar.gz

  package-ios:
    name: Package iOS XCFramework
    needs: build-apple
    runs-on: macos-15

    steps:
      - name: Download iOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: libjpeg-turbo-ios-arm64
          path: package-input/ios

      - name: Download iOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: libjpeg-turbo-ios-simulator-arm64
          path: package-input/ios-simulator

      - name: Create XCFramework
        run: |
          mkdir -p package-work package-output
          tar -xzf package-input/ios/libjpeg-turbo-ios-arm64.tar.gz -C package-work
          tar -xzf package-input/ios-simulator/libjpeg-turbo-ios-simulator-arm64.tar.gz -C package-work

          device_root="${PWD}/package-work/libjpeg-turbo/ios/arm64"
          simulator_root="${PWD}/package-work/libjpeg-turbo/ios-simulator/arm64"
          for library_name in libjpeg.a libturbojpeg.a; do
            if [ ! -f "${device_root}/lib/${library_name}" ] || [ ! -f "${simulator_root}/lib/${library_name}" ]; then
              echo "Unable to locate ${library_name} in libjpeg-turbo iOS artifacts" >&2
              exit 1
            fi
          done

          mkdir -p package-output/ios package-output/ios-simulator
          device_lib="${PWD}/package-output/ios/libjpeg-turbo.a"
          simulator_lib="${PWD}/package-output/ios-simulator/libjpeg-turbo.a"
          libtool -static -o "${device_lib}" \
            "${device_root}/lib/libjpeg.a" \
            "${device_root}/lib/libturbojpeg.a"
          libtool -static -o "${simulator_lib}" \
            "${simulator_root}/lib/libjpeg.a" \
            "${simulator_root}/lib/libturbojpeg.a"

          xcodebuild -create-xcframework \
            -library "${device_lib}" -headers "${device_root}/include" \
            -library "${simulator_lib}" -headers "${simulator_root}/include" \
            -output package-output/libjpeg-turbo-ios.xcframework

          cd package-output
          ditto -c -k --sequesterRsrc --keepParent libjpeg-turbo-ios.xcframework libjpeg-turbo-ios.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-ios-xcframework
          path: package-output/libjpeg-turbo-ios.xcframework.zip
