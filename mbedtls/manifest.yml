name: mbedtls
version: 3.5.2
release: mbedtls-3.5.2-r2
source:
  type: git
  url: https://github.com/Mbed-TLS/mbedtls.git
  tag: v3.5.2
build:
  cmake_options:
    ENABLE_TESTING: OFF
    ENABLE_PROGRAMS: OFF
artifact:
  include:
    - mbedtls
    - psa
  libraries:
    - mbedtls
    - mbedcrypto
    - mbedx509
  archives:
    - mbedtls-linux-x86_64.tar.gz
    - mbedtls-linux-armv7l.tar.gz
    - mbedtls-linux-aarch64.tar.gz
    - mbedtls-windows-x86.tar.gz
    - mbedtls-windows-x64.tar.gz
    - mbedtls-windows-arm64.tar.gz
    - mbedtls-android-arm64-v8a.tar.gz
    - mbedtls-ios-arm64.tar.gz
    - mbedtls-ios-simulator-arm64.tar.gz
    - mbedtls-ios.xcframework.zip
    - mbedtls-macos-arm64.tar.gz
