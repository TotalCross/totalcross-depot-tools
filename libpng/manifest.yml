name: libpng
version: 1.6.48
release: libpng-1.6.48
source:
  type: git
  url: https://github.com/glennrp/libpng.git
  tag: v1.6.48
build:
  requires:
    - zlib-ng
artifact:
  include:
    - png.h
    - pngconf.h
    - pnglibconf.h
  libraries:
    - png
  archives:
    - libpng-linux-x86_64.tar.gz
    - libpng-linux-armv7l.tar.gz
    - libpng-linux-aarch64.tar.gz
    - libpng-windows-x86.tar.gz
    - libpng-android-arm64-v8a.tar.gz
    - libpng-ios-xcframework.tar.gz
    - libpng-macos-arm64.tar.gz
