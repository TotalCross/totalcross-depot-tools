name: sqlite3-see
version: 3.32.3
release: sqlite3-see-3.32.3
source:
  type: private
  env:
    - SQLITE_SEE_ARCHIVE
    - SQLITE_SEE_URL
build:
  cmake_options:
    - SQLITE_HAS_CODEC
    - SQLITE_ENABLE_COLUMN_METADATA
    - SQLITE_ENABLE_FTS5
    - SQLITE_ENABLE_RTREE
artifact:
  include:
    - sqlite3.h
    - sqlite3ext.h
  libraries:
    - sqlite3-see

