name: minizip
version: 1.3.1
release: minizip-1.3.1
source:
  type: git
  url: https://github.com/madler/zlib.git
  tag: v1.3.1
dependencies:
  zlib:
    version: 1.3.1
    release: zlib-1.3.1-r2
artifact:
  include:
    - crypt.h
    - ioapi.h
    - unzip.h
    - zip.h
  libraries:
    - minizip
  archives:
    - minizip-linux-x86_64.tar.gz
    - minizip-linux-armv7l.tar.gz
    - minizip-linux-aarch64.tar.gz
    - minizip-windows-x86.tar.gz
    - minizip-windows-x64.tar.gz
    - minizip-windows-arm64.tar.gz
    - minizip-android-arm64-v8a.tar.gz
    - minizip-ios-arm64.tar.gz
    - minizip-ios-simulator-arm64.tar.gz
    - minizip-ios.xcframework.zip
    - minizip-macos-arm64.tar.gz
